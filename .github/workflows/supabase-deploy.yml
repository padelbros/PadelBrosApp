# Runs automatically when something in supabase/ changes on main:
# applies new SQL migrations and deploys the send-push function if its code changed.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Safety: do nothing until the baseline export exists
      - name: Check baseline exists
        id: check
        run: |
          if ls supabase/migrations/*_baseline.sql >/dev/null 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "No baseline yet – skipping deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.check.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Link project
        if: steps.check.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"

      - name: Apply new migrations
        if: steps.check.outputs.ok == 'true'
        run: supabase db push --remote --yes -p "$SUPABASE_DB_PASSWORD"

      # Only redeploy the push function when its code changed in this push
      # (or when the workflow is started by hand from the Actions tab).
      - name: Did the push function change?
        id: fn
        if: steps.check.outputs.ok == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE" 2>/dev/null && git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^supabase/functions/send-push/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to send-push – not deploying it."; echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy send-push function
        if: steps.check.outputs.ok == 'true' && steps.fn.outputs.changed == 'true'
        run: supabase functions deploy send-push --use-api --yes
