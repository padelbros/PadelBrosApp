# ONE-TIME job, started by hand (Actions tab → "DB baseline export" → Run workflow).
# Exports the current database structure (no data) from Supabase into
# supabase/migrations/ and marks it – plus update 26 – as already applied,
# so they are never executed again.
name: DB baseline export

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      BASELINE: "20261101000000"
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"

      - name: Export schema (structure only, no user data)
        run: supabase db dump --remote -f "supabase/migrations/${BASELINE}_baseline.sql"

      - name: Mark baseline and update 26 as already applied
        run: supabase migration repair --status applied "$BASELINE" 20261122000026 --remote --yes -p "$SUPABASE_DB_PASSWORD"

      - name: Commit the export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Add database baseline (updates 1-25) exported from Supabase"
          git push
