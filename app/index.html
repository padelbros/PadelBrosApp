// Bild quadratisch zuschneiden und verkleinern (schnell und datensparsam)
function resizeImage(file, size = 320) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : no(new Error("Bild konnte nicht verarbeitet werden.")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error("Dieses Bild kann nicht geöffnet werden.")); };
    img.src = url;
  });
}

/* =====================================================================
   Push-Nachrichten – nur in der installierten App (PB_CONFIG.push)
   ===================================================================== */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error("kein Service Worker")), 4000))]);
async function loadPushState() {
  st.push = null;
  if (!window.PB_CONFIG?.push || !st.api.pushKey) return;
  if (IS_IOS && !isStandalone()) { st.push = "ios-install"; return; }
  if (!("serviceWorker" in navigator && "PushManager" in window && "Notification" in window)) { st.push = "unsupported"; return; }
  if (Notification.permission === "denied") { st.push = "denied"; return; }
  try { const reg = await swReady(); st.push = (await reg.pushManager.getSubscription()) && Notification.permission === "granted" ? "on" : "off"; }
  catch (e) { st.push = "unsupported"; }
}
function b64uBytes(s) {
  const b = atob((s + "===".slice((s.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
function pushEnable() {
  // Die Erlaubnis muss direkt beim Antippen angefragt werden (sonst blockiert das iPhone)
  const permP = Notification.requestPermission();
  return run(async () => {
    const perm = await permP;
    if (perm !== "granted") {
      await loadPushState();
      throw new Error(perm === "denied" ? "Push-Nachrichten wurden nicht erlaubt. Du kannst sie später in den Einstellungen des Handys einschalten." : "Push-Nachrichten wurden nicht aktiviert.");
    }
    const reg = await swReady(), key = await st.api.pushKey();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(key) });
    const j = sub.toJSON();
    await st.api.savePushSub(j.endpoint, j.keys.p256dh, j.keys.auth);
    st.push = "on"; toast("Push-Nachrichten sind aktiv ✓");
  });
}
async function pushDisable() {
  const reg = await swReady(), sub = await reg.pushManager.getSubscription();
  if (sub) { await st.api.deletePushSub(sub.endpoint).catch(() => {}); await sub.unsubscribe().catch(() => {}); }
  st.push = "off";
}
function pushLaterSet() { try { localStorage.setItem("pb-push-later", String(Date.now())); } catch (e) {} st.pushLater = true; }
function pushLater() { if (st.pushLater) return true; try { return Date.now() - Number(localStorage.getItem("pb-push-later") || 0) < 3 * 864e5; } catch (e) { return false; } }
function pushBanner() {
  if (st.push !== "off" || pushLater()) return "";
  return `<div class="wrap" style="padding-bottom:0"><div class="note blue" style="display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-top:14px">
    <span style="flex:1;min-width:210px"><b>Push-Nachrichten aktivieren</b><br>Erfahre sofort von Bewerbungen, Bestätigungen und freien Plätzen.</span>
    <span style="display:flex;gap:8px"><button class="cta small dark" data-push="on">Aktivieren</button><button class="cta small ghost" data-push="later">Später</button></span></div></div>`;
}
function pushBlock() {
  if (!st.push) return "";
  const t = {
    on: ["Aktiv auf diesem Gerät ✓", `<button class="cta small dark" data-push="test">Testnachricht senden</button><button class="cta small ghost" data-push="off">Ausschalten</button>`],
    off: ["Erfahre sofort von Bewerbungen, Bestätigungen, freien Plätzen und neuen Aufgaben.", `<button class="cta small dark" data-push="on">Push-Nachrichten aktivieren</button>`],
    "ios-install": ["Auf dem iPhone kommen Push-Nachrichten nur in der installierten App an: in Safari unten auf <b>Teilen</b> → <b>„Zum Home-Bildschirm“</b>, dann die App über das PadelBros-Icon öffnen.", ""],
    denied: ["Push-Nachrichten sind auf diesem Gerät blockiert. iPhone: <b>Einstellungen → Mitteilungen → PadelBros</b> → erlauben. Android: lange auf das App-Icon tippen → <b>App-Info → Benachrichtigungen</b>.", ""],
    unsupported: ["Dieser Browser unterstützt keine Push-Nachrichten. Öffne die App am besten über das PadelBros-Icon auf dem Handy.", ""],
  }[st.push];
  return `<h3 class="sec">Push-Nachrichten</h3><p class="lead" style="margin-top:0">${t[0]}</p>${t[1] ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${t[1]}</div>` : ""}`;
}
function pushClick(D) {
  if (!D.push) return false;
  if (D.push === "on") pushEnable();
  else if (D.push === "off") run(async () => { await pushDisable(); toast("Push-Nachrichten ausgeschaltet"); });
  else if (D.push === "test") run(async () => { await st.api.pushTest(); toast("Testnachricht verschickt – sie kommt in wenigen Sekunden"); });
  else if (D.push === "later") { pushLaterSet(); render(true); }

  const exact = hits.some(p => p.name.toLowerCase() === q);
  return `<div class="list">${hits.map(p => `<button class="li" data-rp-sel="${p.id}" style="width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer">
      <span class="n">${esc(p.name)}<small>${p.team_id ? esc(st.data.team[p.team_id]?.name || "") : p.is_guest ? "Gast" : "Replacement Pool"}</small></span></button>`).join("")}
    ${!exact ? `<button class="li" data-rp-new="1" style="width:100%;text-align:left;background:none;border:0;cursor:pointer">
      <span class="n">„${esc(state.query.trim())}“ eintragen<small>Person ist noch nicht in der App</small></span></button>` : ""}</div>`;
}
function wireReplPicker(sh, state) {
  const res = () => { const r = sh.querySelector("#rp-res"); if (r) r.innerHTML = replResults(state); bind(); };
  const bind = () => {
    sh.querySelectorAll("[data-rp-sel]").forEach(b => b.onclick = () => { state.id = b.dataset.rpSel; state.name = ""; res(); });
    sh.querySelectorAll("[data-rp-new]").forEach(b => b.onclick = () => { state.name = state.query.trim(); state.id = null; res(); });
    sh.querySelectorAll("[data-rp-clear]").forEach(b => b.onclick = () => { state.id = null; state.name = ""; res(); });
  };
  const q = sh.querySelector("#rp-q"); if (q) q.oninput = () => { state.query = q.value; state.id = null; state.name = ""; res(); };
  bind();
}

// Für einen Termin: Ersatz nachtragen (eigene Abmeldung) oder als Admin Ausfall + Ersatz eintragen
function replSheet(sid, admin) {
  const s = st.data.sessions.find(x => x.id === sid), i = info(s);
  const roster = st.data.players.filter(p => p.team_id === s.team_id && p.active).sort((a, b) => a.name.localeCompare(b.name, "de"));
  const freeAbs = new Set(i.absences.filter(a => !i.assignments.some(x => x.absence_id === a.id)).map(a => a.player_id));
  const state = { team: s.team_id, query: "", id: null, name: "", who: admin ? "" : st.me.id };
  st.openSid = null; st.openTid = null; st.openEid = null;
  openSheet(`<h2>${admin ? "Ausfall + Ersatz eintragen" : "Ersatz eintragen"}</h2>
    <p class="sub">${esc(i.team.name)}, ${fShort(s.starts_at)}, ${fTime(s.starts_at)} Uhr</p>
    ${admin ? `<label class="field"><span>Wer fällt aus?</span><select id="rs-who"><option value="">Bitte wählen</option>${roster.map(p => {
      const asg = i.absences.some(a => a.player_id === p.id) && !freeAbs.has(p.id);
      return `<option value="${p.id}" ${asg ? "disabled" : ""}>${esc(p.name)}${freeAbs.has(p.id) ? " (abgemeldet, ohne Ersatz)" : asg ? " (hat schon Ersatz)" : ""}</option>`; }).join("")}</select></label>` : ""}
    ${replPickerHtml(state)}
    <div class="note">${admin ? "Gilt sofort, z. B. für bereits vereinbarte Fälle." : "Gilt sofort. Der Platz erscheint dann nicht mehr als frei, und dein Ersatz zahlt dir die 25 € direkt."}</div>
    <p class="err hidden" id="rs-err"></p>
    <div class="actions"><button class="cta primary" id="rs-save">Eintragen</button><button class="cta ghost" data-open="${sid}">Zurück</button></div>`);
  const sh = $("#scrim"); wireReplPicker(sh, state);
  sh.querySelector("#rs-save").onclick = () => {
    const who = admin ? sh.querySelector("#rs-who").value : st.me.id;
    if (!who) return formErr("#rs-err", "Bitte auswählen, wer ausfällt.");
    if (!state.id && !state.name) return formErr("#rs-err", "Bitte den Ersatz auswählen oder seinen Namen eintippen.");
    run(async () => {
      st.openSid = sid;
      await st.api.reportAbsence(sid, { player: admin ? who : null, replacement: state.id, replacementName: state.name });
      toast("Ersatz eingetragen ✓");
    });
  };
}

// Teams beobachten: Ersatzspieler bekommen eine Mitteilung, sobald dort ein Platz frei wird
async function loadWatches() {
  if (!st.api.loadWatches) { st.watches = null; return; }
  try { st.watches = new Set(await st.api.loadWatches()); } catch (e) { st.watches = null; }
}
function watchBlock() {
  if (!st.watches) return "";
  const d = st.data, me = st.me;
  const teams = d.teams.filter(t => t.id !== me.team_id && d.teamPools.some(tp => tp.team_id === t.id && me.pools.includes(tp.pool_id)))
    .sort((a, b) => (a.sort || 0) - (b.sort || 0));
  if (!teams.length) return "";
  return `<h3 class="sec">Teams beobachten</h3>
    <p class="lead" style="margin-top:0">Du bekommst eine Mitteilung, sobald in diesen Teams ein Platz frei wird.</p>
    <div class="chips" style="flex-wrap:wrap;margin-bottom:10px">${teams.map(t => `<button class="chip" aria-pressed="${st.watches.has(t.id)}" data-watch="${t.id}">${esc(t.name)}</button>`).join("")}</div>`;
}
function replClick(D, b) {
  if (D.watch) {
    const on = !st.watches.has(D.watch);
    on ? st.watches.add(D.watch) : st.watches.delete(D.watch);
    b.setAttribute("aria-pressed", on);
    st.api.setWatch(st.me, D.watch, on).then(() => toast(on ? "Team wird beobachtet" : "Beobachtung beendet"))
      .catch(e => { on ? st.watches.delete(D.watch) : st.watches.add(D.watch); b.setAttribute("aria-pressed", !on); toast(friendly(e)); });
    return true;
  }
  if (D.replMine) { replSheet(D.replMine, false); return true; }
  if (D.replAdmin) { replSheet(D.replAdmin, true); return true; }
  return false;
}

  const views = { events: viewEvents, notes: viewNotes, heute: viewToday, tasks: viewTasks, start: viewStart, mine: viewMine, pool: viewPool, apps: viewApps, profile: viewProfile, admin: viewAdmin, teams: viewTeams, boards: viewBoards, shifts: viewShifts };
  const nav = links.map(([k, l]) => `<button data-nav="${k}" aria-current="${st.view === k ? "page" : "false"}">${l}</button>`).join("");

    ${st.api.demo ? '<div class="demo">Demo-Modus – Daten bleiben nur in diesem Browser</div>' : ""}
    ${EMBED ? `<div class="bar"><div class="chips">${links.map(([k, l]) => `<button class="chip" data-nav="${k}" aria-pressed="${st.view === k}">${l}</button>`).join("")}</div>
      <button class="me-btn" data-nav="profile" aria-label="Profil von ${esc(me.name)}">${meAvatar(me)}</button></div>` : `<header class="top${st.menuOpen ? " open" : ""}"><div class="top-in">
      <button class="logo" data-nav="${links[0]?.[0] || "profile"}" aria-label="Zur Startseite"><img src="${LOGO}" alt="PadelBros"><span><b>PadelBros</b>App</span></button>
      <nav class="links" aria-label="Hauptnavigation">${nav}</nav>
      <button class="me-btn" data-nav="profile" aria-label="Profil von ${esc(me.name)}">${meAvatar(me)}</button>
      <button class="burger" data-menu aria-expanded="${!!st.menuOpen}" aria-controls="menu" aria-label="Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${st.menuOpen ? '<path d="M6 6l12 12M18 6 6 18"/>' : '<path d="M4 7h16M4 12h16M4 17h16"/>'}</svg></button>
    </div>
    <nav class="menu ${st.menuOpen ? "" : "hidden"}" id="menu" aria-label="Menü">${nav}<button data-nav="profile" aria-current="${st.view === "profile" ? "page" : "false"}">Profil</button></nav>
    </header>`}
    <main id="main">${pushBanner()}${(views[st.view] || viewStart)()}</main>`;
  if (keepScroll) scrollTo(0, y);
  const f = $("#filters");
  if (f) { const on = () => f.classList.toggle("stuck", f.getBoundingClientRect().top <= (EMBED ? 1 : 68)); removeEventListener("scroll", window._pbs); window._pbs = on; addEventListener("scroll", on, { passive: true }); on(); }
}

  const d = st.api.db, groups = {};
  for (const p of d.players.filter(p => p.active)) (groups[p.team_id || "pool"] ||= []).push(p);
  const team = id => d.teams.find(t => t.id === id)?.name || "Nur Replacement Pool";
  const order = [...d.teams.map(t => t.id), "pool"];
  const admin = d.players.find(p => p.is_admin);
  APPEL().innerHTML = `<div class="demo">Demo-Modus – Daten bleiben nur in diesem Browser</div><div class="login"><div class="lh">${EMBED ? "" : `<img src="${LOGO}" alt="PadelBros">`}
    <h1 class="display">PadelBros.</h1>
    <p class="intro">Demo: Wähle eine Person und probiere aus, was sie sehen und tun darf.</p></div>
    <div class="lb"><div>
      ${admin ? `<h3 class="sec">Admin</h3><button class="persona" data-as="${admin.id}"><span class="avatar">${initials(admin.name)}</span><span class="pn"><b>${esc(admin.name)}</b><small>${esc(team(admin.team_id))} und Admin</small></span></button>` : ""}
      <input class="search" id="psearch" placeholder="Name suchen" autocomplete="off" style="margin-top:4px">

    </div></div></div>`;
  APPEL().querySelectorAll("[data-as]").forEach(b => b.onclick = async () => { st.api.loginAs(b.dataset.as); await enterOnce(); });
  $("#psearch").oninput = e => { const q = e.target.value.toLowerCase();
    $("#plist2").querySelectorAll("[data-as]").forEach(b => b.classList.toggle("hidden", !!q && !b.textContent.toLowerCase().includes(q)));
    $("#plist2").querySelectorAll("[data-grp]").forEach(h => h.classList.toggle("hidden", !!q)); };

function loginReal(msg) {
  let email = "";
  const draw = (stage, err) => {
    APPEL().innerHTML = `<div class="login"><div class="lh">${EMBED ? "" : `<img src="${LOGO}" alt="PadelBros">`}
      <h1 class="display">PadelBros.</h1>
      <p class="intro">Teams, Replacement Pool, Aufgaben und Events – alles an einem Ort.</p>${langSwitch()}</div>
      <div class="lb"><div>
      ${stage === 1 ? `
        <h3 class="sec">Mit deiner E-Mail anmelden</h3>
        <p class="lead">Gib deine E-Mail-Adresse ein. Du bekommst einen Code per Mail – ein Passwort brauchst du nicht. Neu hier? Dann legst du danach kurz dein Profil an.</p>
        <label class="field"><span>E-Mail</span><input id="em" type="email" inputmode="email" autocomplete="email" value="${esc(email)}"></label>
        <button class="cta primary block" id="go">Login-Link senden</button>` : `
        <h3 class="sec">Schau in dein Postfach</h3>
        <p class="lead">Wir haben eine Mail an <b>${esc(email)}</b> geschickt. Tipp auf den Link – oder gib hier den Code aus der Mail ein.</p>
        <label class="field"><span>Code</span><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code aus der Mail"></label>
        <button class="cta primary block" id="go">Anmelden</button>
        <button class="cta ghost block" id="back" style="margin-top:10px">Andere E-Mail verwenden</button>`}
      ${err || msg ? `<p class="err">${esc(err || msg)}</p>` : ""}
      </div></div></div>`;
    const go = $("#go");
    if (stage === 1) {
      const send = async () => { email = $("#em").value.trim().toLowerCase();
        if (!/^\S+@\S+\.\S+$/.test(email)) return draw(1, "Bitte eine gültige E-Mail-Adresse eingeben.");
        go.disabled = true; go.textContent = "Wird gesendet …";
        try { await st.api.sendCode(email); msg = ""; draw(2); } catch (e) { draw(1, /rate|limit/i.test(e.message) ? "Zu viele Versuche. Warte ein paar Minuten." : friendly(e)); } };
      go.onclick = send; $("#em").onkeydown = e => { if (e.key === "Enter") send(); };
    } else {
      const ver = async () => { const c = $("#code").value.replace(/\D/g, ""); if (c.length < 6) return draw(2, "Bitte den vollständigen Code aus der Mail eingeben.");
        go.disabled = true; try { await st.api.verifyCode(email, c); } catch (e) { draw(2, "Der Code stimmt nicht oder ist abgelaufen."); } };
      go.onclick = ver; $("#code").onkeydown = e => { if (e.key === "Enter") ver(); }; $("#back").onclick = () => draw(1);
    }
  };
  draw(1);
}

// Startvorgang und Login-Ereignis können gleichzeitig auslösen – nur einmal betreten.
let entering = null;
function enterOnce() { if (!entering) entering = enter().finally(() => { entering = null; }); return entering; }
// Erstes Mal hier: Name und Niveau angeben, wird als Replacement-Spieler angelegt
async function registerReal() {
  let pools = [], name = "";
  const sel = new Set();
  try { pools = await st.api.poolOptions(); } catch (e) { console.error(e); }
  const draw = msg => {
    const old = $("#rn"); if (old) name = old.value;
    APPEL().innerHTML = `<div class="login"><div class="lh">${EMBED ? "" : `<img src="${LOGO}" alt="PadelBros">`}
      <h1 class="display">Willkommen.</h1>
      <p class="intro">Du bist noch nicht im Replacement Pool eingetragen. Leg kurz dein Profil an – danach siehst du alle offenen Trainingsplätze und kannst einspringen.</p></div>
      <div class="lb"><div>
        <label class="field"><span>Vor- und Nachname</span><input id="rn" autocomplete="name" maxlength="60" value="${esc(name)}"></label>
        <h3 class="sec">Auf welchem Niveau spielst du?</h3>
        <p class="lead">Du kannst mehrere wählen. Herren 1 ist das stärkste Team. Du siehst dann nur Plätze in diesen Teams.</p>
        <div class="chips" style="flex-wrap:wrap">${pools.map(p => `<button class="chip" aria-pressed="${sel.has(p.id)}" data-rp="${esc(p.id)}">${esc(p.name)}</button>`).join("")}</div>
        <button class="cta primary block" id="rgo" style="margin-top:20px">Profil anlegen</button>
        <button class="cta ghost block" id="rout" style="margin-top:10px">Andere E-Mail verwenden</button>
        ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
      </div></div></div>`;
    APPEL().querySelectorAll("[data-rp]").forEach(b => b.onclick = () => {
      const id = b.dataset.rp; sel.has(id) ? sel.delete(id) : sel.add(id); draw(); });
    $("#rout").onclick = async () => { await st.api.signOut(); st.me = null; loginReal(); };
    const go = async () => {
      name = $("#rn").value.trim();
      if (name.length < 2) return draw("Bitte gib deinen Vor- und Nachnamen an.");
      if (!sel.size) return draw("Bitte wähle mindestens ein Niveau.");
      $("#rgo").disabled = true;
      try { await st.api.register(name, [...sel]); await enterOnce(); toast("Willkommen im Replacement Pool!"); }
      catch (e) { draw(friendly(e)); }
    };
    $("#rgo").onclick = go;
    $("#rn").onkeydown = e => { if (e.key === "Enter") go(); };
  };
  draw();
}

async function enter() {
  APPEL().innerHTML = '<div class="loading">Lädt …</div>';
  try {
    st.me = await st.api.me();
    if (!st.me) {
      if (st.api.demo) { await st.api.signOut(); return loginDemo(); }
      return registerReal();   // neu hier: Profil als Replacement-Spieler anlegen
    }
    st.data = await st.api.load(); index();
    if (st.me.is_staff) { await loadTasks(); if (st.view === "start") st.view = "heute"; }
    await loadNotes(); await loadWatches(); await loadPay(); await loadPushState(); trackPresence();
    st.api.setLanguage?.(LANG).catch(() => {});
    // Erinnerungen an fehlende Schicht-Zusagen anstoßen (Ersatz, falls der tägliche Zeitplan einmal ausfällt)
    try { const t = Number(localStorage.getItem("pb-up") || 0); if (st.me.is_staff && st.api.remindUpcoming && Date.now() - t > 15 * 6e4) { localStorage.setItem("pb-up", String(Date.now())); st.api.remindUpcoming().then(loadNotes).then(() => render(true)).catch(() => {}); } } catch (e) {}
    try { const k3 = "pb-openalert-" + isoToday(); if (isPlanner() && st.api.alertOpenShifts && !localStorage.getItem(k3)) { localStorage.setItem(k3, "1"); st.api.alertOpenShifts().then(loadNotes).then(() => render(true)).catch(() => {}); } } catch (e) {}
    try { const k2 = "pb-purge-" + isoToday(); if (st.api.purgeChats && !localStorage.getItem(k2)) { localStorage.setItem(k2, "1"); st.api.purgeChats().catch(() => {}); } } catch (e) {}
    try { const k = "pb-remind-" + isoToday(); if (st.me.is_staff && st.api.remindShifts && !localStorage.getItem(k)) { localStorage.setItem(k, "1"); st.api.remindShifts().then(loadNotes).then(() => render(true)).catch(() => {}); } } catch (e) {}
    render(); openFromPush();
    if (!st.subscribed) { st.subscribed = true; st.api.subscribe(reload); }
  } catch (e) { console.error(e); APPEL().innerHTML = `<div class="empty"><b>Fehler beim Laden</b>${esc(friendly(e))}<br><br><button class="cta small dark" onclick="location.reload()">Neu laden</button></div>`; }
}

async function boot() {
  startTranslation();
  const cfg = window.PB_CONFIG || {};
  try {
    if (!st.api) {
      if (!(cfg.supabaseUrl && cfg.supabaseAnonKey) && !window.PB_DEMO) {
        // Demo-Daten nur laden, wenn keine Datenbank eingetragen ist
        await new Promise(res => { const sc = document.createElement("script");
          sc.src = "demo-daten.js"; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
      }
      if (cfg.supabaseUrl && cfg.supabaseAnonKey) st.api = new SupabaseApi(cfg);
      else if (window.PB_DEMO) st.api = new DemoApi(window.PB_DEMO);
      else { APPEL().innerHTML = `<div class="empty"><b>Noch nicht eingerichtet</b>Trag in config.js die Supabase-Daten ein.</div>`; return; }
      await st.api.init();
      st.api.onAuth(s => { if (s && !st.me) enterOnce(); });
    }
    const s = await st.api.session();
    if (s) await enterOnce(); else if (!st.me) st.api.demo ? loginDemo() : loginReal();
  } catch (e) { console.error(e); APPEL().innerHTML = `<div class="empty"><b>Start fehlgeschlagen</b>${esc(friendly(e))}</div>`; }
}
// Für automatisierte Tests – kein Einfluss auf den Betrieb
window.__pb = { st, info, render, detailSheet, reportSheet, applySheet, closeSheet, loadAdminPlayers, loginDemo, isoToday, fTime, taskSheet, loadTasks, loadNotes, eventSheet, replSheet };
boot();
})();
