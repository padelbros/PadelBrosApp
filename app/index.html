<style>html,body{margin:0;background:#fff}
/* Bögen immer an der sichtbaren Bildschirmbreite ausrichten, auch wenn ein Theme seitlich überläuft */
.pb .scrim{right:auto;width:100vw}
.pb .sheet{max-width:min(640px,100vw)}

/* über jedem Theme-Header liegen, egal welche Ebene das Theme nutzt */
.pb .scrim{z-index:2147483000}
.pb .toast{z-index:2147483001}
</style>
<style>
/* Alles hier gilt nur innerhalb von .pb – das Shopify-Theme bleibt unberührt */
.pb button{-webkit-appearance:none;appearance:none;margin:0;text-transform:none;box-shadow:none;min-width:0;letter-spacing:inherit}
.pb h1,.pb h2,.pb h3,.pb p{text-transform:none}
.pb.embedded{--pb-sticky:0px;max-width:1180px;margin:0 auto}
.pb.embedded main{padding-top:18px}
/* ------------------------------------------------------------------ Marke
   Werte von padel-bros.de übernommen. Für Anpassungen nur hier ändern. */
.pb{
  --orange:#C6693A;      /* PadelBros-Orange */
  --orange-d:#A9542A;
  --pill:#FDF9F7;        /* Hintergrund der Tags */
  --ink:#111111;
  --text:#2B2B2B;
  --muted:#6F6F6F;
  --line:#E2E2E2;
  --bg:#FFFFFF;
  --soft:#F7F5F3;
  --ok:#2F7D4F; --need:#B8322A; --cand:#C6693A; --swap:#2F6DA8; --off:#9A9A9A;
  --display:var(--font-heading-family,"Bricolage Grotesque"),"Bricolage Grotesque","Arial Black",Impact,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-card:24px; --r-md:14px;
}
.pb *{box-sizing:border-box}
.pb,.pb{margin:0}
.pb{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.pb button,.pb input,.pb select{font:inherit;color:inherit}
.pb button{cursor:pointer}
.pb a{color:inherit}
.pb :focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.pb .hidden{display:none!important}
/* ------------------------------------------------------------------ Kopfzeile wie auf der Website */
.pb .bar{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.pb .bar .chips{flex:1}
.pb .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.pb .top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.pb .logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-decoration:none}
.pb .logo img{height:46px;width:auto;display:block}
.pb .logo span{font-family:var(--cond);font-weight:700;font-size:15px;line-height:1.05;color:var(--ink);text-align:left}
.pb .logo span b{display:block;color:var(--orange);font-size:17px}
.pb .links{display:flex;gap:4px;margin:0 auto}
.pb .links button{background:none;border:0;padding:8px 12px;font-size:16.5px;letter-spacing:.02em;color:#3A3A3A;
  border-radius:999px}
.pb .links button:hover{color:var(--ink)}
.pb .links button[aria-current="page"]{color:var(--ink);font-weight:600}
.pb .me-btn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;margin-left:auto}
.pb .avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;
  font-family:var(--cond);font-weight:700;font-size:16px;flex:none}
.pb .burger{display:none;background:none;border:0;width:44px;height:44px;border-radius:12px;align-items:center;justify-content:center}
.pb .burger svg{width:26px;height:26px}
.pb .menu{border-top:1px solid var(--line);padding:6px 20px 14px;background:#fff}
.pb .menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:15px 2px;font-size:18px}
.pb .menu button:last-child{border-bottom:0}
.pb .menu button[aria-current="page"]{color:var(--orange);font-weight:600}
@media (max-width:899px){.pb .links{display:none}
.pb .burger{display:flex}
.pb .me-btn{margin-left:auto}
.pb .logo img{height:40px}
 }
@media (max-width:899px){
  .pb .top.open ~ main{display:none}
  .pb .top.open .menu{min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box}
}
@media (min-width:900px){.pb .menu{display:none!important}
 }
.pb main{max-width:1180px;margin:0 auto;padding:28px 20px 70px}
.pb .wrap{max-width:860px;margin:0 auto}
/* ------------------------------------------------------------------ Headline im Academy-Stil */
.pb .display{font-family:var(--display);font-weight:800;color:var(--orange);letter-spacing:-.035em;
  line-height:.92;margin:6px 0 18px;font-size:clamp(46px,10vw,112px)}
.pb .display.sm{font-size:clamp(38px,7vw,64px);margin-bottom:10px}
.pb .intro{font-family:var(--cond);font-weight:600;font-size:clamp(19px,2.3vw,23px);line-height:1.3;color:var(--ink);
  max-width:760px;margin:0 0 20px}
.pb .pills{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
.pb .pillf{background:var(--pill);border:1.5px solid #EBC9B6;color:var(--orange);border-radius:999px;padding:8px 16px;
  font-family:var(--cond);font-weight:700;font-size:16.5px;min-height:40px}
.pb .pillf[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.pb hr.rule{border:0;border-top:1px solid var(--line);margin:28px 0 26px}
.pb .hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.pb .hero .num{font-family:var(--display);font-weight:800;font-size:clamp(56px,9vw,80px);line-height:.85;color:var(--orange);letter-spacing:-.03em}
.pb .hero .num.zero{color:var(--ok)}
.pb .hero p{margin:0;font-family:var(--cond);font-weight:700;font-size:23px;line-height:1.15;color:var(--ink)}
.pb .hero p span{display:block;font-weight:500;color:var(--muted);font-size:17px}
.pb .lead{margin:0 0 16px;color:var(--muted);font-size:16px}
/* ------------------------------------------------------------------ Buttons: Pillen wie „Auf Playtomic buchen“ */
.pb .cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:999px;border:0;
  font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.01em;padding:10px 26px}
.pb .cta.block{display:flex;width:100%}
.pb .cta.primary{background:var(--orange);color:#fff}
.pb .cta.primary:hover{background:var(--orange-d)}
.pb .cta.dark{background:var(--ink);color:#fff}
.pb .cta.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.pb .cta.danger{background:#fff;border:1.5px solid #E6B3AC;color:var(--need)}
.pb .cta:disabled{opacity:.4;cursor:not-allowed}
.pb .cta.small{min-height:42px;font-size:16.5px;padding:6px 18px}
/* ------------------------------------------------------------------ Filter */
.pb .filters{position:sticky;top:var(--pb-sticky,67px);z-index:10;background:rgba(255,255,255,.97);margin:0 -20px;padding:12px 20px 10px;
  border-bottom:1px solid transparent}
.pb .filters.stuck{border-bottom-color:var(--line)}
.pb .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pb .chips::-webkit-scrollbar{display:none}
.pb .chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;
  font-family:var(--cond);font-weight:600;font-size:17px;min-height:40px;white-space:nowrap;color:var(--ink)}
.pb .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pb .chip.toggle[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
/* ------------------------------------------------------------------ Termine */
.pb .day{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:30px 0 12px;color:var(--ink)}
.pb .day small{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:0;color:#fff;background:var(--orange);
  border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:5px}
.pb .card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:12px;
  overflow:hidden;width:100%;text-align:left;padding:0;display:block}
.pb .card .edge{position:absolute;left:0;top:0;bottom:0;width:6px}
.pb .card .body{display:flex;gap:14px;padding:18px 20px 18px 24px;align-items:center}
.pb .card .info{flex:1;min-width:0}
.pb .eyebrow{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pb .team{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1;color:var(--orange)}
.pb .when{font-family:var(--cond);font-weight:600;font-size:18px;color:var(--text);margin-top:4px}
.pb .status{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-family:var(--cond);font-weight:700;font-size:17px}
.pb .status i{width:10px;height:10px;border-radius:50%;flex:none}
.pb .score{text-align:right;flex:none}
.pb .score b{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;color:var(--ink);letter-spacing:-.03em}
.pb .score b span{color:#B5B5B5;font-size:30px}
.pb .score small{display:block;font-family:var(--cond);font-weight:600;font-size:14px;color:var(--muted);margin-top:4px}
.pb .card .act{display:flex;gap:8px;padding:0 20px 18px 24px}
.pb .rows{border:1px solid var(--line);border-radius:var(--r-md);padding:0 16px;margin-bottom:12px}
.pb .row{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:13px 2px;text-align:left}
.pb .row:last-child{border-bottom:0}
.pb .row .t{font-family:var(--cond);font-weight:700;font-size:20px;min-width:92px;color:var(--ink)}
.pb .row .w{flex:1;color:var(--muted);font-family:var(--cond);font-weight:500;font-size:17px}
.pb .row .s{font-family:var(--cond);font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.pb .row .s i{width:9px;height:9px;border-radius:50%}
.pb .st-voll{--c:var(--ok)}
.pb .st-gesucht{--c:var(--need)}
.pb .st-bewerber{--c:var(--cand)}
.pb .st-ersetzt{--c:var(--swap)}
.pb .st-abgesagt{--c:var(--off)}
.pb .st-voll .edge,.pb .st-gesucht .edge,.pb .st-bewerber .edge,.pb .st-ersetzt .edge,.pb .st-abgesagt .edge{background:var(--c)}
.pb .st-voll .status i,.pb .st-gesucht .status i,.pb .st-bewerber .status i,.pb .st-ersetzt .status i,.pb .st-abgesagt .status i,.pb .row .s i{background:var(--c)}
.pb .status,.pb .row .s{color:var(--c)}
.pb .mine{display:inline-block;margin-left:10px;font-family:var(--cond);font-size:14px;font-weight:700;color:var(--orange);
  background:var(--pill);border:1.5px solid #EBC9B6;border-radius:999px;padding:1px 10px;vertical-align:6px;letter-spacing:0}
.pb .empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:17px}
.pb .empty b{display:block;font-family:var(--display);font-size:32px;letter-spacing:-.02em;color:var(--orange);margin-bottom:6px}
/* ------------------------------------------------------------------ Overlays */
.pb .scrim{position:fixed;inset:0;background:rgba(17,17,17,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  animation:fade .15s ease}
.pb .sheet{outline:none;background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;
  padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.pb .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px;position:relative}
.pb .grab::after{content:"";position:absolute;inset:-16px -60px}
.pb .sheet{overscroll-behavior:contain;overflow-x:hidden}
.pb .sheet .chips{flex-wrap:wrap;overflow-x:visible}
.pb .av{width:var(--s,28px);height:var(--s,28px);border-radius:50%;flex:none;display:inline-grid;place-items:center;background:var(--soft);color:var(--ink);border:1px solid var(--line);font-size:calc(var(--s,28px) * .38);font-weight:700;overflow:hidden;vertical-align:middle;box-sizing:border-box}
.pb .av img{width:100%;height:100%;object-fit:cover;display:block}
.pb .avatar{overflow:hidden}
.pb .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pb .av-edit{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.pb .kb{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 28px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;max-width:1180px;margin:0 auto}
.pb .kb-col{flex:0 0 min(82vw,290px);scroll-snap-align:start;background:var(--soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pb .kb-col header{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:15px}
.pb .kb-col header span{color:var(--muted);font-weight:600}
.pb .kb-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;min-width:0}
.pb .kb-card.late{border-color:var(--need)}
.pb .kb-card.blocked{opacity:.8}
.pb .kb-open{all:unset;box-sizing:border-box;display:block;cursor:pointer;width:100%;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.pb .kb-open small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.pb .kb-mv{display:flex;justify-content:space-between;margin-top:8px}
.pb .kb-mv button{border:1px solid var(--line);background:none;border-radius:8px;width:44px;height:32px;font-size:18px;cursor:pointer;color:var(--ink)}
.pb .kb-card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pb .kb-dragging{opacity:.35}
.pb .kb-ghost{position:fixed;z-index:200;pointer-events:none;transform:rotate(2deg);box-shadow:0 12px 30px rgba(0,0,0,.18);margin:0}
.pb .kb-drop{height:4px;border-radius:2px;background:var(--orange);margin:2px 4px}
.pb .tgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pb .tg{display:inline-block;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;background:hsl(var(--h) 75% 92%);color:hsl(var(--h) 45% 28%);font-weight:600}
.pb .kb-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;cursor:pointer;font:inherit;color:inherit}
.pb .kb-row .n{flex:1;min-width:0}.pb .kb-row small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.pb .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pb .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.pb .cal-w{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.pb .cal-c{min-height:56px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:3px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;font:inherit;color:inherit;min-width:0;overflow:hidden}
.pb .cal-c.off{border:0;background:none;cursor:default}.pb .cal-c.today{border-color:var(--orange)}.pb .cal-c.sel{background:var(--pill);border-color:var(--orange)}
.pb .cal-d{font-size:12px;font-weight:700}.pb .cal-t{font-size:10.5px;line-height:1.2;background:var(--soft);border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb .cal-more{font-size:10.5px;color:var(--muted)}
.pb .md{margin-top:4px;line-height:1.45}.pb .md p{margin:6px 0}.pb .md ul,.pb .md ol{margin:6px 0;padding-left:22px}
.pb .md .md-check{list-style:none;padding-left:2px}.pb .md .md-check li.done{color:var(--muted);text-decoration:line-through}
.pb .md .md-h1{font-weight:800;font-size:20px;margin:12px 0 4px}.pb .md .md-h2{font-weight:800;font-size:17px;margin:10px 0 4px}.pb .md .md-h3{font-weight:700;margin:8px 0 2px}
.pb .md a{color:var(--orange);overflow-wrap:anywhere}
.pb .sh-list{display:flex;flex-direction:column;gap:6px}
.pb .sh-day{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:20px;margin:22px 0 8px}
.pb .sh-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.pb .sh-row.me{border-color:var(--orange);background:var(--pill)}
.pb .sh-row.open{border-color:var(--need)}
.pb .sh-k{font-weight:700;width:52px;flex:none;font-size:14px}
.pb .sh-t{flex:none;width:96px;font-size:14.5px}.pb .sh-t small{display:block;color:var(--muted);font-size:12px}
.pb .sh-p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb .sh-open{flex:1;color:var(--need);font-weight:800;letter-spacing:.04em}
.pb .sh-st{flex:none;color:var(--ok,#1a7f37);font-weight:700;min-width:22px;text-align:right}
.pb .sh-sum{margin-top:12px;border-top:1px solid var(--line)}
.pb .sh-sumrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.pb .sh-sumrow .n{flex:1;min-width:0}.pb .sh-sumrow .ok{color:var(--ok,#1a7f37)}
.pb .chat{max-height:46vh;min-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px;margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overscroll-behavior:contain}
.pb .bub{max-width:82%;align-self:flex-start;background:var(--soft);border-radius:14px 14px 14px 4px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.pb .bub.mine{align-self:flex-end;background:var(--pill);border:1px solid #EBC9B6;border-radius:14px 14px 4px 14px}
.pb .bub small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.pb .chat-in{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.pb .chat-in textarea{flex:1;min-width:0;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px;resize:none;box-sizing:border-box}
.pb .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--need);color:#fff;font-size:12px;font-weight:800;margin-left:6px}
.pb .si.under{color:var(--orange);font-weight:700}.pb .si.over{color:var(--need);font-weight:700}.pb .si.ok{color:var(--ok,#1a7f37);font-weight:700}
.pb button.sh-sumrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer}
.pb .sh-sumrow > span:not(.n):not(.av){min-width:64px;text-align:right}
.pb .sh-head{font-size:12.5px;color:var(--muted);font-weight:600}
.pb .bds{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex:none;max-width:52%}
.pb .bd{font-size:11.5px;padding:3px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pb .bd.bad{background:#fde8e6;border-color:var(--need);color:var(--need);font-weight:700}.pb .bd.ok{color:var(--ok,#1a7f37)}
.pb .kb-add{border:1.5px dashed var(--line);background:none;border-radius:10px;padding:10px;color:var(--muted);cursor:pointer;font:inherit}
.pb{overflow-x:clip}
.pb .chips{overscroll-behavior-x:contain}
@media (min-width:700px){.pb .scrim{align-items:center}
.pb .sheet{border-radius:28px;max-height:88vh}
.pb .grab{display:none}
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pb .scrim,.pb .sheet{animation:none}
}
.pb .sheet h2{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.035em;line-height:.95;margin:6px 0 0;color:var(--orange)}
.pb .sheet .sub{font-family:var(--cond);font-weight:600;color:var(--ink);margin:8px 0 0;font-size:19px;line-height:1.3}
.pb .board{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--orange);color:#fff;
  border-radius:20px;padding:16px 20px;margin:18px 0}
.pb .board b{font-family:var(--display);font-weight:800;font-size:60px;letter-spacing:-.03em;line-height:.85}
.pb .board b span{opacity:.6;font-size:40px}
.pb .board .bs{font-family:var(--cond);font-weight:700;font-size:19px;text-align:right;line-height:1.25}
.pb .board .bs small{display:block;font-weight:500;opacity:.85;font-size:16px}
.pb .sec{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:22px 0 8px;color:var(--ink)}
.pb .list{border:1px solid var(--line);border-radius:var(--r-md);padding:2px 16px}
.pb .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16.5px}
.pb .li:last-child{border-bottom:0}
.pb .li .ic{width:24px;text-align:center;flex:none;font-size:16px}
.pb .li .n{flex:1;min-width:0}
.pb .li .n small{display:block;color:var(--muted);font-size:14.5px}
.pb .li.me .n{font-weight:700}
.pb .li .pos{font-family:var(--display);font-weight:800;font-size:22px;color:var(--orange);width:26px;text-align:center}
.pb .note{background:var(--pill);border:1px solid #F0D9CC;border-radius:var(--r-md);padding:13px 15px;font-size:16px;margin:12px 0}
.pb .note.blue{background:#EEF4FA;border-color:#D6E4F1}
.pb .note.green{background:#EEF6F1;border-color:#D4E8DB}
.pb .actions{display:grid;gap:10px;margin-top:20px}
.pb .sheet .actions{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));margin:20px -22px 0;
  padding:14px 22px calc(22px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -12px 18px -14px rgba(0,0,0,.25)}
.pb .sheet .actions .cta{width:100%}
.pb .pick{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:var(--r-md);padding:13px 16px;margin-bottom:8px;text-align:left;min-height:62px}
.pb .pick[aria-checked="true"]{border-color:var(--orange);background:var(--pill)}
.pb .pick:disabled{opacity:.5}
.pb .box{width:24px;height:24px;border-radius:7px;border:2px solid #CFCFCF;flex:none;display:grid;place-items:center}
.pb .pick[aria-checked="true"] .box{background:var(--orange);border-color:var(--orange)}
.pb .pick[aria-checked="true"] .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) translate(-1px,-1px)}
.pb .pick .pd{flex:1}
.pb .pick .pd b{font-family:var(--cond);font-size:21px;font-weight:700;color:var(--ink)}
.pb .pick .pd small{display:block;color:var(--muted);font-size:15px}
.pb .field{display:block;margin:14px 0}
.pb .field span{display:block;font-family:var(--cond);font-size:17px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.pb .field{min-width:0}
.pb .field input,.pb .field select{width:100%;min-width:0;max-width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:10px 16px;background:#fff;font-size:17px}
.pb .field input:focus,.pb .field select:focus{border-color:var(--orange);outline:none}
.pb .field input[type=date],.pb .field input[type=time]{display:block;-webkit-appearance:none;appearance:none;text-align:left}
.pb .field input[type=date]::-webkit-date-and-time-value,.pb .field input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
/* ------------------------------------------------------------------ Login */
.pb .login{min-height:100vh;background:#fff}
.pb .login .lh{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 36px) 22px 4px}
.pb .login .lh img{height:72px;margin-bottom:18px}
.pb .login .lb{max-width:760px;margin:0 auto;padding:0 22px 60px}
.pb .login .lb>div{max-width:520px}
.pb .persona{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-md);padding:11px 14px;margin-bottom:8px;text-align:left;min-height:58px}
.pb .persona:hover{border-color:var(--orange)}
.pb .persona .pn{flex:1}
.pb .persona .pn b{font-family:var(--cond);font-size:19px}
.pb .persona .pn small{display:block;color:var(--muted);font-size:14.5px}
.pb .err{color:var(--need);font-size:16px;margin:12px 0 0}
.pb .prof{border:1px solid var(--line);border-radius:var(--r-card);padding:22px}
.pb .kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16.5px}
.pb .kv:last-child{border-bottom:0}
.pb .kv span{color:var(--muted)}
.pb .tag{display:inline-block;background:var(--pill);border:1.5px solid #EBC9B6;color:var(--orange);border-radius:999px;
  padding:1px 10px;font-family:var(--cond);font-size:15px;font-weight:700;margin:0 0 0 4px}
.pb .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:999px;font-family:var(--cond);font-size:18px;font-weight:600;
  z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
.pb .toast.on{opacity:1}
.pb .demo{background:var(--orange);color:#fff;text-align:center;font-family:var(--cond);font-size:15px;font-weight:600;padding:5px 10px}
.pb .loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.pb .admin-p{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.pb .admin-p .n{flex:1;min-width:0}
.pb .admin-p .n small{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.pb .search{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;background:#fff;margin-bottom:12px}
.pb .split{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.pb .split{grid-template-columns:auto 1fr;align-items:end}
}

</style>
</head>

const TR = (() => {
  if (LANG !== "en") return null;
  const exact = new Map(), pats = [];
  const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  for (const [de, en] of Object.entries(I18N_EN)) {
    if (!de.includes("{}")) { exact.set(de, en); continue; }
    const parts = de.split("{}");
    const lit = parts.map(x => x.trim()).filter(Boolean).sort((a, b) => b.length - a.length)[0] || "";
    pats.push({ re: new RegExp("^" + parts.map(esc).join("([\\s\\S]*?)") + "$"), en, lit, len: de.length });
  }

      me.is_manager ? q("recurring_tasks").order("created_at") : Promise.resolve({ data: [] })]);
    for (const x of r) if (x.error) throw x.error;
    const [categories, list, participants, checklist, commentsList, templates] = r.map(x => x.data);
    return { categories, list, participants, checklist, commentsList, templates };
  }
  async loadEvents() {
    const q = t => this.sb.from(t).select("*");
    const r = await Promise.all([q("events").order("starts_at"), q("event_staff"), q("event_comments").order("created_at")]);
    for (const x of r) if (x.error) throw x.error;
    return { list: r[0].data, staff: r[1].data, comments: r[2].data };
  }
  async saveEvent(id, row, staff) {
    let eid = id;
    if (eid) await this.must(this.sb.from("events").update(row).eq("id", eid).select("id"), "Nicht erlaubt.");
    else eid = (await this.must(this.sb.from("events").insert(row).select("id")))[0].id;
    await this.must(this.sb.from("event_staff").delete().eq("event_id", eid));
    if (staff.length) await this.must(this.sb.from("event_staff").insert(staff.map(player_id => ({ event_id: eid, player_id }))));
    return eid;
  }
  deleteEvent(id) { return this.must(this.sb.from("events").delete().eq("id", id).select("id"), "Nicht erlaubt."); }
  addEventComment(me, event_id, body) { return this.must(this.sb.from("event_comments").insert({ event_id, author_id: me.id, body }).select("id")); }
  async loadNotes() { const { data, error } = await this.sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(100); if (error) throw error; return data; }
  markRead(ids) { return this.must(this.sb.from("notifications").update({ read_at: new Date().toISOString() }).in("id", ids)); }
  async runReminders() { const k = Math.floor(Date.now() / 9e5); if (this._rem === k) return; this._rem = k; await this.sb.rpc("notify_due_tasks"); }
  async taskHistory(id) { const { data, error } = await this.sb.from("task_history").select("*").eq("task_id", id).order("at"); if (error) throw error; return data; }
  setTaskStatus(id, status, reason) { return this.must(this.sb.from("tasks").update({ status, blocked_reason: status === "blockiert" ? reason : null }).eq("id", id).select("id"), "Nicht erlaubt."); }
  toggleCheck(id, done) { return this.must(this.sb.from("task_checklist").update({ done }).eq("id", id).select("id"), "Nicht erlaubt."); }
  addComment(me, task_id, body) { return this.must(this.sb.from("task_comments").insert({ task_id, author_id: me.id, body }).select("id")); }
  deleteTask(id) { return this.must(this.sb.from("tasks").delete().eq("id", id).select("id"), "Nicht erlaubt."); }
  async saveTask(me, id, row, parts, checklist) {
    let tid = id;
    if (tid) await this.must(this.sb.from("tasks").update(row).eq("id", tid).select("id"), "Nicht erlaubt.");
    else tid = (await this.must(this.sb.from("tasks").insert(row).select("id")))[0].id;
    if (me.is_manager) {
      await this.must(this.sb.from("task_participants").delete().eq("task_id", tid));
      if (parts.length) await this.must(this.sb.from("task_participants").insert(parts.map(player_id => ({ task_id: tid, player_id }))));
    }
    const { data: cur, error } = await this.sb.from("task_checklist").select("id,text").eq("task_id", tid);
    if (error) throw error;
    const keep = new Set(checklist), have = new Set(cur.map(c => c.text));
    const del = cur.filter(c => !keep.has(c.text)).map(c => c.id);
    if (del.length && me.is_manager) await this.must(this.sb.from("task_checklist").delete().in("id", del));
    const add = checklist.map((text, k) => ({ task_id: tid, text, sort: k + 1 })).filter(c => !have.has(c.text));
    if (add.length) await this.must(this.sb.from("task_checklist").insert(add));
    return tid;
  }
  async saveTemplate(id, row) {
    if (id) await this.must(this.sb.from("recurring_tasks").update(row).eq("id", id).select("id"), "Nicht erlaubt.");
    else await this.must(this.sb.from("recurring_tasks").insert(row).select("id"));
    this._ensured = null;
  }
  async cancelReplacement(_me, sid) { const { error } = await this.sb.rpc("cancel_my_replacement", { sid }); if (error) throw error; }
  async savePlayer(_me, p, pools) {
    let id = p.id;
    const row = { name: p.name, email: p.email ? p.email.toLowerCase() : null, team_id: p.team_id || null, is_admin: !!p.is_admin, active: p.active !== false, is_staff: !!p.is_staff, is_manager: !!p.is_manager, is_coach: !!p.is_coach, is_super_admin: !!p.is_super_admin };
    if (id) await this.must(this.sb.from("players").update(row).eq("id", id));
    else { id = crypto.randomUUID(); await this.must(this.sb.from("players").insert({ id, ...row })); }
    await this.must(this.sb.from("player_pools").delete().eq("player_id", id));
    if (pools.length) await this.must(this.sb.from("player_pools").insert(pools.map(pool_id => ({ player_id: id, pool_id }))));
  }
}

class DemoApi {
  constructor(seed) { this.seed = seed; this.demo = true; this.KEY = "pb-demo-v3"; }
  async init() {
    try { this.db = JSON.parse(localStorage.getItem(this.KEY) || "null"); } catch (e) { this.db = null; }
    if (!this.db) this.db = this.build();
    try { this.meId = localStorage.getItem(this.KEY + "-me"); } catch (e) {}
  }
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.db)); } catch (e) {} }
  reset() { try { localStorage.removeItem(this.KEY); localStorage.removeItem(this.KEY + "-me"); } catch (e) {} }
  build() {
    const S = this.seed, db = { pools: S.pools, teams: S.teams, teamPools: S.teamPools, slots: S.slots,
      players: [], playerPools: [], sessions: [], absences: [], applications: [], assignments: [], reasons: [] };
    const tp = id => S.teamPools.filter(x => x.team_id === id).map(x => x.pool_id);
    for (const p of S.players) {
      const id = uid();
      db.players.push({ id, name: p.name, team_id: p.team_id, is_admin: p.is_admin, active: true, can_login: p.can_login });
      for (const pool of (p.team_id ? tp(p.team_id) : (p.pools || S.defaultPoolOnly))) db.playerPools.push({ player_id: id, pool_id: pool });
    }
    const [y0, m0, d0] = S.seasonStart.split("-").map(Number), end = new Date(S.seasonEnd + "T23:59:00Z");
    for (const sl of S.slots) {
      for (let t = Date.UTC(y0, m0 - 1, d0); t <= end; t += 864e5) {
        const dt = new Date(t), wd = (dt.getUTCDay() + 6) % 7 + 1;
        if (wd !== sl.weekday) continue;
        const [sh, sm] = sl.start_time.split(":").map(Number), [eh, em] = sl.end_time.split(":").map(Number);
        const Y = dt.getUTCFullYear(), M = dt.getUTCMonth() + 1, D = dt.getUTCDate();
        db.sessions.push({ id: uid(), slot_id: sl.id, team_id: sl.team_id, label: sl.label, coach: sl.coach,
          starts_at: berlin(Y, M, D, sh, sm), ends_at: berlin(Y, M, D, eh, em), cancelled: false });
      }
    }
    db.sessions.sort((a, b) => a.starts_at.localeCompare(b.starts_at));
    // Beispielsituationen, damit jeder Status direkt sichtbar ist
    const P = n => db.players.find(p => p.name === n).id;
    const next = (team, label = "Training", k = 0) => db.sessions.filter(s => s.team_id === team && s.label === label && new Date(s.ends_at) > new Date())[k];
    const ago = m => new Date(Date.now() - m * 60000).toISOString();
    const abs = (s, n, r) => { const a = { id: uid(), session_id: s.id, player_id: P(n), created_at: ago(600) }; db.absences.push(a); if (r) db.reasons.push({ absence_id: a.id, reason: r }); return a; };
    const app = (s, n, m) => db.applications.push({ id: uid(), session_id: s.id, player_id: P(n), created_at: ago(m) });
    let s;
    if ((s = next("H2"))) { abs(s, "Louis Schwarzer", "Arbeit"); app(s, "Nico Bensch", 300); app(s, "Lukas Küntscher", 240); app(s, "Alexander Frank", 90); }
    if ((s = next("H5"))) abs(s, "Tobias Röstel", "Urlaub");
    if ((s = next("H4"))) { const a = abs(s, "Adrian Heine", "Krankheit"); app(s, "Daniel Daimer", 400);
      db.assignments.push({ id: uid(), session_id: s.id, player_id: P("Daniel Daimer"), absence_id: a.id, assigned_by: P("Lukas Hagel"), created_at: ago(120) }); }
    if ((s = next("H3", "Training", 1))) { abs(s, "Carl Sander"); app(s, "David Jacob", 50); }
    if ((s = next("H1"))) abs(s, "Noah Heissel", "Urlaub");
    if ((s = next("W1"))) { abs(s, "Emma Ring", "Arbeit"); app(s, "Ons Attia", 200); }
    if ((s = next("H6", "Training", 1))) { abs(s, "Bobby Saptura"); app(s, "Erol Uen", 30); }
    return db;
  }
  // ---------------------------------------------------- Regeln (wie RLS)
  meRow() { return this.db.players.find(p => p.id === this.meId && p.active); }
  pools(pid) { return this.db.playerPools.filter(x => x.player_id === pid).map(x => x.pool_id); }
  isAdmin() { return !!this.meRow()?.is_admin; }
  open(sid) {
    const s = this.db.sessions.find(x => x.id === sid), t = this.db.teams.find(x => x.id === s.team_id);
    const roster = this.db.players.filter(p => p.team_id === s.team_id && p.active).map(p => p.id);
    const abs = this.db.absences.filter(a => a.session_id === sid && roster.includes(a.player_id)).length;
    const asg = this.db.assignments.filter(a => a.session_id === sid).length;
    return Math.max(0, t.size - (roster.length - abs + asg));
  }
  canApply(sid) {
    const me = this.meRow(), s = this.db.sessions.find(x => x.id === sid);
    if (!me || !s || s.cancelled || new Date(s.starts_at) <= new Date() || s.team_id === me.team_id) return false;
    const tp = this.db.teamPools.filter(x => x.team_id === s.team_id).map(x => x.pool_id);
    return this.pools(me.id).some(p => tp.includes(p)) && this.open(sid) > 0;
  }
  deny(m = "Das ist nicht erlaubt.") { throw new Error(m); }
  // ---------------------------------------------------- Schnittstelle
  async session() { return this.meRow() ? { demo: true } : null; }
  onAuth() {}
  loginAs(id) { this.meId = id; try { localStorage.setItem(this.KEY + "-me", id); } catch (e) {} }
  async signOut() { this.meId = null; try { localStorage.removeItem(this.KEY + "-me"); } catch (e) {} }
  async me() {
    const p = this.meRow(); if (!p) return null;
    return { id: p.id, name: p.name, email: "(Demo)", team_id: p.team_id, is_admin: p.is_admin, pools: this.pools(p.id).sort() };
  }
  async load() {
    const d = this.db, me = this.meRow(), admin = this.isAdmin();
    const mine = new Set(d.absences.filter(a => a.player_id === me?.id).map(a => a.id));
    return JSON.parse(JSON.stringify({ ...d, reasons: d.reasons.filter(r => admin || mine.has(r.absence_id)) }));
  }
  subscribe() {}
  async addAbsences(me, ids, reason) {
    for (const sid of ids) {
      const s = this.db.sessions.find(x => x.id === sid);
      const ok = this.isAdmin() || (s && s.team_id === this.meRow().team_id && !s.cancelled && new Date(s.starts_at) > new Date());
      if (!ok) this.deny();
      if (this.db.absences.some(a => a.session_id === sid && a.player_id === me.id)) continue;
      const a = { id: uid(), session_id: sid, player_id: me.id, created_at: new Date().toISOString() };
      this.db.absences.push(a); if (reason) this.db.reasons.push({ absence_id: a.id, reason });
    }
    this.save();
  }
  async removeAbsence(me, id) {
    const a = this.db.absences.find(x => x.id === id); if (!a) return;
    const s = this.db.sessions.find(x => x.id === a.session_id);
    const linked = this.db.assignments.some(x => x.absence_id === id);
    if (!(this.isAdmin() || (a.player_id === me.id && !linked && new Date(s.starts_at) > new Date())))
      this.deny("Abmeldung kann nicht mehr zurückgenommen werden.");
    this.db.absences = this.db.absences.filter(x => x.id !== id);
    this.db.reasons = this.db.reasons.filter(x => x.absence_id !== id);
    this.db.assignments.forEach(x => { if (x.absence_id === id) x.absence_id = null; });
    this.save();
  }
  async apply(me, sid) {
    if (!this.canApply(sid)) this.deny("Für diesen Termin kannst du dich nicht bewerben.");
    if (this.db.applications.some(a => a.session_id === sid && a.player_id === me.id)) this.deny("Du stehst schon auf der Liste.");
    this.db.applications.push({ id: uid(), session_id: sid, player_id: me.id, created_at: new Date().toISOString() });
    this.save();
  }
  async withdraw(me, id) {
    const a = this.db.applications.find(x => x.id === id); if (!a) return;
    const assigned = this.db.assignments.some(x => x.session_id === a.session_id && x.player_id === a.player_id);
    if (!(this.isAdmin() || (a.player_id === me.id && !assigned))) this.deny("Bewerbung kann nicht mehr zurückgezogen werden.");
    this.db.applications = this.db.applications.filter(x => x.id !== id); this.save();
  }
  async assign(me, sid, pid, absenceId) {
    const s = this.db.sessions.find(x => x.id === sid), p = this.db.players.find(x => x.id === pid);
    const ownAbs = absenceId && this.db.absences.some(a => a.id === absenceId && a.player_id === me.id && a.session_id === sid);
    const applied = this.db.applications.some(a => a.session_id === sid && a.player_id === pid);
    if (!(this.isAdmin() || (ownAbs && applied && new Date(s.starts_at) > new Date() && !s.cancelled))) this.deny();
    if (p.team_id === s.team_id) this.deny("Teamspieler können nicht im eigenen Team einspringen.");
    if (this.db.assignments.some(x => x.session_id === sid && x.player_id === pid)) this.deny("Schon eingeteilt.");
    if (absenceId && this.db.assignments.some(x => x.absence_id === absenceId)) { if (!this.isAdmin()) this.deny("Für diesen Platz ist schon jemand bestätigt."); absenceId = null; }
    this.db.assignments.push({ id: uid(), session_id: sid, player_id: pid, absence_id: absenceId || null, assigned_by: me.id, created_at: new Date().toISOString() });
    this.save();
  }
  async loadNotes() { return []; }
  async markRead() {}
  async cancelReplacement(me, sid) {
    const s = this.db.sessions.find(x => x.id === sid);
    if (!this.db.assignments.some(x => x.session_id === sid && x.player_id === me.id)) this.deny("Du bist für dieses Training nicht als Ersatz bestätigt.");
    if (new Date(s.starts_at) - Date.now() <= 2 * 864e5) this.deny("Absagen geht nur bis 2 Tage vor dem Training. Melde dich bitte bei einem Admin.");
    this.db.assignments = this.db.assignments.filter(x => !(x.session_id === sid && x.player_id === me.id));
    this.db.applications = this.db.applications.filter(x => !(x.session_id === sid && x.player_id === me.id));
    this.save();
  }
  async unassign(_me, id) { if (!this.isAdmin()) this.deny(); this.db.assignments = this.db.assignments.filter(x => x.id !== id); this.save(); }
  async setCancelled(_me, sid, v) { if (!this.isAdmin()) this.deny(); this.db.sessions.find(x => x.id === sid).cancelled = v; this.save(); }
  async adminPlayers() {
    if (!this.isAdmin()) return [];
    return this.db.players.map(p => ({ ...p, email: p.can_login ? "(Demo – keine Adressen)" : null }));
  }
  async savePlayer(_me, p, pools) {
    if (!this.isAdmin()) this.deny();
    let row = this.db.players.find(x => x.id === p.id);
    if (!row) { row = { id: uid(), can_login: true }; this.db.players.push(row); }
    Object.assign(row, { name: p.name, team_id: p.team_id || null, is_admin: !!p.is_admin, active: p.active !== false });
    this.db.playerPools = this.db.playerPools.filter(x => x.player_id !== row.id).concat(pools.map(pool_id => ({ player_id: row.id, pool_id })));
    this.save();
  }
}

/* =====================================================================
   Zustand & abgeleitete Daten
   ===================================================================== */
const canCoach = () => !!(st.me && (st.me.is_admin || st.me.is_coach));
const st = { api: null, me: null, data: null, view: "start", f: { range: "week", pool: "all", openOnly: false }, adminTab: "offen" };

function index() {
  const d = st.data;
  d.team = Object.fromEntries(d.teams.map(t => [t.id, t]));
  d.player = Object.fromEntries(d.players.map(p => [p.id, p]));
  d.poolName = Object.fromEntries(d.pools.map(p => [p.id, p.name]));
  d.teamPoolIds = {}; for (const x of d.teamPools) (d.teamPoolIds[x.team_id] ||= []).push(x.pool_id);
  d.reasonOf = Object.fromEntries(d.reasons.map(r => [r.absence_id, r.reason]));
  d.roster = {}; for (const p of d.players) if (p.team_id && p.active) (d.roster[p.team_id] ||= []).push(p);
  for (const k in d.roster) d.roster[k].sort((a, b) => a.name.localeCompare(b.name, "de"));
  const by = (arr, k) => { const m = {}; for (const x of arr) (m[x[k]] ||= []).push(x); return m; };
  d.absBy = by(d.absences, "session_id"); d.appBy = by(d.applications, "session_id"); d.asgBy = by(d.assignments, "session_id");
  d.sessions.sort((a, b) => a.starts_at.localeCompare(b.starts_at));
}

// Alles, was die Oberfläche über einen Termin wissen muss
function info(s) {
  const d = st.data, me = st.me, team = d.team[s.team_id], roster = d.roster[s.team_id] || [];
  const rosterIds = new Set(roster.map(p => p.id));
  const absences = (d.absBy[s.id] || []).filter(a => rosterIds.has(a.player_id));
  const assignments = d.asgBy[s.id] || [];
  const applications = (d.appBy[s.id] || []).slice().sort((a, b) => a.created_at.localeCompare(b.created_at));
  const confirmed = roster.length - absences.length + assignments.length;
  const open = Math.max(0, team.size - confirmed);
  const now = new Date(), future = new Date(s.starts_at) > now, live = new Date(s.ends_at) > now;
  const assignedIds = new Set(assignments.map(a => a.player_id));
  const waiting = applications.filter(a => !assignedIds.has(a.player_id));
  let status;
  if (s.cancelled) status = "abgesagt";
  else if (open > 0) status = waiting.length ? "bewerber" : "gesucht";
  else status = assignments.length ? "ersetzt" : "voll";
  const myAbs = absences.find(a => a.player_id === me.id);
  const myApp = applications.find(a => a.player_id === me.id);
  const myAsg = assignments.find(a => a.player_id === me.id);
  const pools = d.teamPoolIds[s.team_id] || [];
  const poolMatch = me.pools.some(p => pools.includes(p));
  const isMine = me.team_id === s.team_id;
  return { s, team, roster, absences, assignments, applications, waiting, confirmed, open, status, future, live,
    myAbs, myApp, myAsg, pools, poolMatch, isMine,
    canApply: !s.cancelled && future && !isMine && poolMatch && open > 0 && !myApp,
    canReport: isMine && future && !s.cancelled && !myAbs,
    canUndo: !!myAbs && future && !assignments.some(a => a.absence_id === myAbs.id),
    canWithdraw: !!myApp && !myAsg,
    cancelUntil: new Date(new Date(s.starts_at).getTime() - 2 * 864e5).toISOString(),
    canCancelAsg: !!myAsg && !s.cancelled && new Date(s.starts_at) - now > 2 * 864e5 };
}

function statusText(i) {
  switch (i.status) {
    case "abgesagt": return "Training fällt aus";
    case "voll": return "Vollständig besetzt";
    case "ersetzt": return "Vollständig – mit Replacement";
    case "gesucht": return `${i.open} ${plural(i.open, "Replacement", "Replacements")} gesucht`;
    case "bewerber": return `${i.open} ${plural(i.open, "Platz", "Plätze")} frei, ${i.waiting.length} ${plural(i.waiting.length, "Bewerbung", "Bewerbungen")}`;
  }
}

function scoreHtml(i) {
  return `<div class="score"><b>${Math.min(i.confirmed, i.team.size)}<span>/${i.team.size}</span></b><small>dabei</small></div>`;
}
function cardHtml(i) {
  const s = i.s, open = i.open > 0 && !s.cancelled;
  const tag = i.isMine ? '<span class="mine">Dein Team</span>' : i.myAsg ? '<span class="mine">Du spielst</span>' : i.myApp ? '<span class="mine">Beworben</span>' : "";
  if (!open) {
    return `<button class="row st-${i.status}" data-open="${s.id}">
      <span class="t">${esc(i.team.name)}</span>
      <span class="w">${fTime(s.starts_at)}${s.label !== "Training" ? " " + esc(s.label) : ""}${tag}</span>
      <span class="s"><i></i>${i.status === "ersetzt" ? "mit Ersatz " : i.status === "abgesagt" ? "fällt aus" : ""}${i.status === "abgesagt" ? "" : `${Math.min(i.confirmed, i.team.size)}/${i.team.size}`}</span></button>`;
  }
  const btn = i.canApply ? `<div class="act"><button class="cta primary small" data-apply="${s.id}">Platz übernehmen</button></div>`
    : i.myApp && !i.myAsg ? `<div class="act"><span class="status" style="color:var(--cand);margin:0">Du stehst auf Platz ${i.applications.findIndex(a => a.id === i.myApp.id) + 1} der Bewerberliste</span></div>` : "";
  return `<div class="card st-${i.status}"><span class="edge"></span>
    <button class="body" style="background:none;border:0;width:100%;text-align:left" data-open="${s.id}">
      <div class="info">
        <div class="eyebrow">${esc(s.label)}</div>
        <div class="team">${esc(i.team.name)}${tag}</div>
        <div class="when">${fTime(s.starts_at)} – ${fTime(s.ends_at)} Uhr${s.coach ? ", Coach " + esc(s.coach) : ""}</div>
        <div class="status"><i></i>${statusText(i)}</div>
      </div>${scoreHtml(i)}
    </button>${btn}</div>`;
}

function groupByDay(infos) {
  let out = "", key = null, buf = [];
  const flush = () => {
    if (!buf.length) return;
    const cards = buf.filter(i => i.open > 0 && !i.s.cancelled).map(cardHtml).join("");
    const rows = buf.filter(i => !(i.open > 0 && !i.s.cancelled)).map(cardHtml).join("");
    out += cards + (rows ? `<div class="rows">${rows}</div>` : ""); buf = [];
  };
  for (const i of infos) {
    const k = dayKey(i.s.starts_at);
    if (k !== key) { flush(); key = k;
      const today = dayKey(new Date()) === k;
      out += `<h3 class="day">${fDay(i.s.starts_at)}${today ? "<small>heute</small>" : ""}</h3>`; }
    buf.push(i);
  }
  flush(); return out;
}

function inRange(s) {
  const t = s.starts_at, r = st.f.range;
  if (new Date(s.ends_at) <= new Date()) return false;
  if (r === "week") return t < weekStart(1);
  if (r === "next") return t >= weekStart(1) && t < weekStart(2);
  if (r === "month") return t < monthEnd();
  return true;
}

function openSheet(html) {
  const keep = st.openSid, keepT = st.openTid, keepE = st.openEid; closeSheet(); st.openSid = keep; st.openTid = keepT; st.openEid = keepE;
  const el = document.createElement("div");
  el.className = "scrim"; el.id = "scrim";
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab"></div>${html}</div>`;
  el.addEventListener("click", e => { if (e.target === el) closeSheet(); });
  ROOT().appendChild(el); document.body.style.overflow = "hidden";
  const sh = el.querySelector(".sheet"), keepTop = sh.scrollTop;
  swipeToClose(el, sh);
  sh.focus({ preventScroll: true }); sh.scrollTop = keepTop;
}
// Fenster nach unten wegwischen (wie bei iPhone-Fenstern)
function swipeToClose(scrim, sh) {
  let y0 = null, dy = 0, t0 = 0, grab = false;
  sh.addEventListener("touchstart", e => {
    y0 = null;
    if (e.touches.length !== 1 || e.target.closest("input,textarea,select")) return;
    grab = !!e.target.closest(".grab");
    if (!grab && sh.scrollTop > 0) return;          // Inhalt ist gescrollt: erst normal hochscrollen
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); sh.style.transition = "none";
  }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { sh.style.transform = ""; scrim.style.background = ""; if (!grab) y0 = null; return; }
    if (e.cancelable) e.preventDefault();
    sh.style.transform = `translateY(${dy}px)`;
    scrim.style.background = `rgba(17,17,17,${Math.max(0, .42 * (1 - dy / 420)).toFixed(3)})`;
  }, { passive: false });
  const end = () => {
    if (y0 === null) return; y0 = null;
    const flick = dy > 50 && Date.now() - t0 < 250;
    sh.style.transition = "transform .18s ease";
    if (dy > 110 || flick) { sh.style.transform = "translateY(100%)"; scrim.style.background = "rgba(17,17,17,0)"; setTimeout(() => { if (scrim.isConnected) closeSheet(); }, 170); }
    else { sh.style.transform = ""; scrim.style.background = ""; }
    dy = 0;
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
}
function closeSheet() { $("#scrim")?.remove(); document.body.style.overflow = ""; st.openSid = null; st.openTid = null; st.openEid = null; }

  const forWhom = i.myAsg?.absence_id ? esc(st.data.player[i.absences.find(a => a.id === i.myAsg.absence_id)?.player_id]?.name || "") : "";
  openSheet(`<h2>Absagen?</h2>
    <p class="sub" style="margin-top:10px">Du sagst deinen Platz bei <b>${esc(i.team.name)}</b> am ${fShort(s.starts_at)} um ${fTime(s.starts_at)} Uhr ab.</p>
    <div class="note">Der Platz wird wieder frei${forWhom ? ` und ${forWhom} kann den Nächsten von der Warteliste bestätigen` : ""}. Deine Bewerbung für dieses Training wird dabei gelöscht.</div>
    <div class="actions"><button class="cta danger" data-cancel-asg-ok="${sid}">Ja, absagen</button>
    <button class="cta ghost" data-open="${sid}">Zurück</button></div>`);
  st.openSid = sid;
}

function reportSheet(preset) {
  st.openSid = null;
  const d = st.data, me = st.me;
  const list = d.sessions.filter(s => s.team_id === me.team_id && new Date(s.starts_at) > new Date() && !s.cancelled).slice(0, 16).map(info);
  const sel = new Set(preset ? [preset] : []); let reason = null;
  const rp = { team: me.team_id, query: "", id: null, name: "", on: false };
  const draw = () => {
    openSheet(`<h2>Ich kann nicht</h2><p class="sub">Wähle die Trainings, bei denen du fehlst. Dein Platz erscheint dann im Replacement Pool.</p>
      <div style="margin-top:14px">${list.map(i => `<button class="pick" role="checkbox" aria-checked="${sel.has(i.s.id) || !!i.myAbs}" ${i.myAbs ? "disabled" : ""} data-pick="${i.s.id}">
        <span class="box"></span><span class="pd"><b>${fShort(i.s.starts_at)}</b> <small>${fTime(i.s.starts_at)} – ${fTime(i.s.ends_at)} Uhr, ${esc(i.s.label)}${i.myAbs ? " – bereits abgemeldet" : ""}</small></span></button>`).join("")}</div>
      <h3 class="sec">Grund <span style="font-weight:500;font-size:15px;color:var(--muted);font-family:var(--body)">optional, sehen nur Admins</span></h3>
      <div class="chips" style="flex-wrap:wrap">${["Urlaub", "Krankheit", "Arbeit", "Verletzung", "Sonstiges"].map(r => `<button class="chip" aria-pressed="${reason === r}" data-reason="${r}">${r}</button>`).join("")}</div>
      ${payHint()}
      ${st.api.reportAbsence ? `<div class="chips" style="margin-top:14px"><button class="chip toggle" aria-pressed="${rp.on}" data-rp-toggle="1">Ich habe schon einen Ersatz</button></div>
      ${rp.on ? replPickerHtml(rp) : ""}` : ""}
      <div class="actions"><button class="cta primary" data-save-report ${sel.size ? "" : "disabled"}>${sel.size ? `Für ${sel.size} ${plural(sel.size, "Training", "Trainings")} abmelden` : "Training auswählen"}</button>
      <button class="cta ghost" data-close>Abbrechen</button></div>`);
    const sh = $("#scrim");
    sh.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const id = b.dataset.pick; sel.has(id) ? sel.delete(id) : sel.add(id); draw(); });
    sh.querySelectorAll("[data-reason]").forEach(b => b.onclick = () => { reason = reason === b.dataset.reason ? null : b.dataset.reason; draw(); });
    const tg = sh.querySelector("[data-rp-toggle]"); if (tg) tg.onclick = () => { rp.on = !rp.on; draw(); };
    if (rp.on) wireReplPicker(sh, rp);
    sh.querySelector("[data-save-report]").onclick = () => run(async () => {
      if (rp.on && !rp.id && !rp.name) throw new Error("Bitte den Ersatz auswählen oder seinen Namen eintippen.");
      if (rp.on) { for (const sid of sel) await st.api.reportAbsence(sid, { replacement: rp.id, replacementName: rp.name, reason }); closeSheet(); return toast("Abgemeldet – dein Ersatz ist eingetragen ✓"); }
      await st.api.addAbsences(me, [...sel], reason); closeSheet();
      toast(`Abgemeldet – ${sel.size === 1 ? "dein Platz ist" : "deine Plätze sind"} jetzt im Pool sichtbar`);
    });
  };
  if (!list.length) return toast("Keine kommenden Trainings gefunden");
  draw();
}

function applySheet(sid) {

    <div class="note">Du kommst damit auf die Bewerberliste${i.applications.length ? ` (aktuell ${i.applications.length} vor dir)` : ""}. Fest ist der Platz erst, wenn ein Admin dich bestätigt. Du zahlst 25 € direkt an die Person, für die du einspringst.</div>
    <div class="actions"><button class="cta primary" data-confirm-apply="${sid}">Bestätigen</button><button class="cta ghost" data-close>Abbrechen</button></div>`);
}

      is_manager: sh.querySelector('[data-pt="is_manager"]').getAttribute("aria-pressed") === "true",

      is_super_admin: sup ? sh.querySelector('[data-pt="is_super_admin"]').getAttribute("aria-pressed") === "true" : !!p.is_super_admin,

    const pools = [...sh.querySelectorAll('[data-pp][aria-pressed="true"]')].map(b => b.dataset.pp);
    const err = $("#perr");
    if (!row.name) { err.textContent = "Bitte einen Namen eingeben."; err.classList.remove("hidden"); return; }
    if (!st.api.demo && row.email && !/^\S+@\S+\.\S+$/.test(row.email)) { err.textContent = "Die E-Mail-Adresse sieht nicht richtig aus."; err.classList.remove("hidden"); return; }
    run(async () => { await st.api.savePlayer(st.me, row, pools); st.adminPlayers = await st.api.adminPlayers(); closeSheet(); toast("Gespeichert"); });
  };
}

function friendly(e) {
  const m = String(e?.message || e);
  if (/row-level security|violates|permission denied/i.test(m)) return "Das ist nicht erlaubt – oder der Platz ist inzwischen vergeben.";
  if (/duplicate key|unique/i.test(m)) return "Das ist schon eingetragen.";
  if (/fetch|network/i.test(m)) return "Keine Verbindung. Prüf dein Internet und versuch es nochmal.";
  return m;
}
async function run(fn) {
  try { await fn(); } catch (e) { console.error(e); toast(friendly(e)); }
  await reload();
}
async function reload() {
  try { st.data = await st.api.load(); index(); if (st.me?.is_staff) await loadTasks(); await loadNotes(); await loadWatches(); await loadPay(); } catch (e) { console.error(e); toast(friendly(e)); }
  if ($("#scrim") && st.openSid) detailSheet(st.openSid);
  else if ($("#scrim") && st.openTid) taskSheet(st.openTid);
  else if ($("#scrim") && st.openEid) eventSheet(st.openEid);
  render();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !b.closest(".pb") || !st.me) return;
  const D = b.dataset;
  if (D.coachAdd) { coachAddSheet(D.coachAdd); return; }
  if (D.ttab) { st.teamsTab = D.ttab; render(true); return; }
  if (D.dteam) { st.dashTeam = D.dteam; render(true); return; }
  if (D.guest) { guestSheet(D.guest); return; }
  if (sugClick(D)) return;
  if (D.paysave) { savePayForm(); return; }
  if (avatarClick(D)) return;
  if (chatClick(D, b) || shiftClick(D, b) || notionClick(D) || boardClick(D, b) || loginClick(D) || pushClick(D) || replClick(D, b) || eventClick(D, b) || taskClick(D, b) || noteClick(D)) return;
  if (D.open) { st.openSid = D.open; return detailSheet(D.open); }
  if ("close" in D) { st.openSid = null; return closeSheet(); }
  if ("menu" in D) { st.menuOpen = !st.menuOpen; return render(true); }
  if (D.nav) { st.view = D.nav; st.menuOpen = false; closeSheet(); render(); return toTop(); }
  if (D.go === "report") return reportSheet();
  if (D.go === "admin") { st.view = "admin"; render(); return toTop(); }
  if (D.f) { st.f[D.f] = D.v; return render(true); }
  if (D.toggle) { st.f[D.toggle] = !st.f[D.toggle]; return render(true); }
  if (D.apply) return applySheet(D.apply);
  if (D.confirmApply) return run(async () => {
    await st.api.apply(st.me, D.confirmApply); await reload();
    const i = info(st.data.sessions.find(s => s.id === D.confirmApply));
    st.openSid = D.confirmApply; detailSheet(D.confirmApply);
    toast(`Du stehst auf der Bewerberliste – Platz ${i.applications.findIndex(a => a.player_id === st.me.id) + 1}`);
  });
  if (D.withdraw) return run(async () => { await st.api.withdraw(st.me, D.withdraw); toast("Bewerbung zurückgezogen"); });
  if (D.reportOne) return reportSheet(D.reportOne);
  if (D.undo) return run(async () => { const own = !!st.data.sessions && Object.values(st.data.absBy || {}).flat().some(a => a.id === D.undo && a.player_id === st.me.id); await st.api.removeAbsence(st.me, D.undo); toast(own ? "Abmeldung zurückgenommen – du bist wieder dabei" : "Abmeldung zurückgenommen"); });
  if (D.assign) return confirmAssignSheet(D.s, D.assign);
  if (D.assignOk) return run(async () => {
    const i = info(st.data.sessions.find(s => s.id === D.s));
    const mine = i.myAbs && !i.assignments.some(x => x.absence_id === i.myAbs.id) ? i.myAbs : null;
    const free = mine || i.absences.find(a => !i.assignments.some(x => x.absence_id === a.id));
    st.openSid = D.s;
    await st.api.assign(st.me, D.s, D.assignOk, free?.id);
    toast(`${first(st.data.player[D.assignOk]?.name)} ist als Replacement bestätigt`);
  });
  if (D.cancelAsg) return cancelAsgSheet(D.cancelAsg);
  if (D.cancelAsgOk) return run(async () => {
    st.openSid = D.cancelAsgOk;
    await st.api.cancelReplacement(st.me, D.cancelAsgOk);
    toast("Abgesagt – der Platz ist wieder frei");
  });
  if (D.unassign) return run(async () => { await st.api.unassign(st.me, D.unassign); toast("Zuordnung gelöst"); });
  if (D.cancel) return run(async () => { await st.api.setCancelled(st.me, D.cancel, D.v === "true"); toast(D.v === "true" ? "Training abgesagt" : "Training wieder angesetzt"); });
  if (D.atab) { st.adminTab = D.atab; if (D.atab === "spieler" && !st.adminPlayers) loadAdminPlayers(); if (D.atab === "anmeldung") loadLoginStatus(); return render(); }
  if (D.pedit) return playerSheet(D.pedit);
  if (D.act === "logout") return (async () => { if (st.push === "on") await Promise.race([pushDisable().catch(() => {}), new Promise(r => setTimeout(r, 2500))]); await st.api.signOut(); st.me = null; st.adminPlayers = null; boot(); })();
  if (D.act === "reset") { st.api.reset(); location.reload(); }
});

const TPRIO = { niedrig: "Niedrig", normal: "Normal", hoch: "Hoch", dringend: "Kritisch" };

const isoDay = d => { const [dd, mm, yy] = dayKey(d).split("."); return `${yy}-${mm}-${dd}`; };
const isoToday = () => isoDay(new Date());
const canManage = () => !!st.me?.is_manager;
function isoParts(iso) {
  const d = new Date(iso);
  return { d: isoDay(d), t: fmt(d, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) };
}
function tIndex() {
  const T = st.tasks;
  T.cat = Object.fromEntries(T.categories.map(c => [c.id, c]));
  T.parts = {}; for (const p of T.participants) (T.parts[p.task_id] ||= []).push(p.player_id);
  T.checks = {}; for (const c of T.checklist) (T.checks[c.task_id] ||= []).push(c);
  for (const k in T.checks) T.checks[k].sort((a, b) => a.sort - b.sort);
  T.comments = {}; for (const c of T.commentsList) (T.comments[c.task_id] ||= []).push(c);
  T.staff = st.data.players.filter(p => p.active && (p.is_staff || p.is_manager || p.is_admin))
    .sort((a, b) => a.name.localeCompare(b.name, "de"));
}
async function loadTasks() {
  if (!st.me?.is_staff || !st.api.loadTasks) { st.tasks = null; return; }
  try { await st.api.runReminders?.(); } catch (e) { /* Erinnerungen sind optional */ }
  try { st.tasks = await st.api.loadTasks(st.me); tIndex(); if (st.api.loadBoards) st.boards = await st.api.loadBoards(); await loadSuggestions(); await loadEvents(); }
  catch (e) { console.error(e); toast(friendly(e)); }
}
function tInfo(t) {
  const checks = st.tasks.checks[t.id] || [], done = checks.filter(c => c.done).length;
  const late = t.status !== "erledigt" && t.status !== "on_hold" && ((t.due_at && new Date(t.due_at) < new Date())
    || (!t.due_at && t.occurrence_date && t.occurrence_date < isoToday()));
  const mine = t.owner_id === st.me.id || (st.tasks.parts[t.id] || []).includes(st.me.id);
  return { checks, done, late, mine, cat: st.tasks.cat[t.category_id], owner: t.owner_id ? st.data.player[t.owner_id] : null };
}
const byUrgency = (a, b) => {
  const la = tInfo(a).late, lb = tInfo(b).late; if (la !== lb) return la ? -1 : 1;
  const pr = { dringend: 0, hoch: 1, normal: 2, niedrig: 3 }; if (a.priority !== b.priority) return pr[a.priority] - pr[b.priority];
  return (a.due_at || "9999").localeCompare(b.due_at || "9999");
};
function tDue(t) {
  if (t.due_at) {
    const d = isoDay(new Date(t.due_at)), today = isoToday(), tom = isoDay(new Date(Date.now() + 864e5));
    return `${d === today ? "heute" : d === tom ? "morgen" : fShort(t.due_at)}, ${fTime(t.due_at)} Uhr`;
  }
  if (t.occurrence_date) return t.occurrence_date === isoToday() ? "heute" : fShort(t.occurrence_date + "T12:00:00Z");
  return "";
}
function tCard(t) {
  const i = tInfo(t), due = tDue(t);
  const who = i.owner ? esc(i.owner.name) : "Alle Mitarbeiter";
  return `<button class="card tcard ${TSCLS[t.status]}" data-topen="${t.id}" style="text-align:left"><span class="edge"></span>
    <span class="body" style="display:flex"><span class="info" style="display:block">
      <span class="eyebrow" style="display:block">${t.recurring_id ? "Daily To-do" : t.event_id ? "Event: " + esc(st.events?.byId[t.event_id]?.title || "") : esc(i.cat?.name || "Aufgabe")}</span>
      <span class="team" style="display:block;font-size:22px">${esc(t.title)}${t.priority !== "normal" ? `<span class="prio ${t.priority}">${TPRIO[t.priority]}</span>` : ""}</span>
      <span class="when ${i.late ? "due-late" : ""}" style="display:block">${who}${due ? `, fällig ${due}` : ""}${i.late ? " – überfällig" : ""}</span>
      <span class="status" style="display:inline-flex"><i></i>${TSTAT[t.status]}${t.status === "blockiert" && t.blocked_reason ? `: ${esc(t.blocked_reason)}` : ""}</span>
      ${i.checks.length ? `<span class="bar-p" style="display:block"><i style="width:${Math.round(100 * i.done / i.checks.length)}%"></i></span><small style="color:var(--muted)">${i.done} von ${i.checks.length} erledigt</small>` : ""}
    </span></span></button>`;
}

function viewToday() {
  if (!st.tasks) return '<div class="wrap"><div class="loading">Lädt …</div></div>';
  const today = isoToday(), L = st.tasks.list;
  const daily = L.filter(t => t.recurring_id && t.occurrence_date === today && (!t.owner_id || t.owner_id === st.me.id || canManage()));
  const open = L.filter(t => !t.recurring_id && t.status !== "erledigt" && relevantToMe(t));
  const lateDaily = L.filter(t => t.recurring_id && t.occurrence_date < today && t.status !== "erledigt" && (!t.owner_id || t.owner_id === st.me.id));
  const late = open.filter(t => tInfo(t).late).concat(lateDaily).sort(byUrgency);
  const blocked = open.filter(t => t.status === "blockiert" && !tInfo(t).late);
  const onhold = open.filter(t => t.status === "on_hold");
  const next = open.filter(t => t.status !== "blockiert" && t.status !== "on_hold" && !tInfo(t).late).sort(byUrgency);
  const dDone = daily.filter(t => t.status === "erledigt").length;
  return `<div class="wrap"><h1 class="display sm">Heute.</h1>
    <p class="intro">${fDay(new Date())}</p>
    ${sugTodayBlock()}
    <div class="tsum"><div><b class="${daily.length && dDone === daily.length ? "ok" : ""}">${dDone}/${daily.length}</b><span>Daily To-dos</span></div>
      <div><b>${open.length}</b><span>offene Aufgaben</span></div>
      <div><b class="${late.length ? "bad" : "ok"}">${late.length}</b><span>überfällig</span></div></div>
    <button class="cta ${canManage() ? "primary" : "ghost"}" data-tnew style="margin-bottom:6px">${canManage() ? "Neue Aufgabe" : "Eigene Aufgabe notieren"}</button>
    ${late.length ? `<h3 class="day">Überfällig</h3>${late.map(tCard).join("")}` : ""}
    <h3 class="day">Daily To-dos</h3>${daily.length ? daily.map(tCard).join("") : '<p class="lead">Für heute ist nichts geplant.</p>'}
    ${blocked.length ? `<h3 class="day">Wartet auf Rückmeldung</h3>${blocked.map(tCard).join("")}` : ""}
    ${onhold.length ? `<h3 class="day">On Hold</h3>${onhold.map(tCard).join("")}` : ""}
    <h3 class="day">Als Nächstes</h3>${next.length ? next.slice(0, 20).map(tCard).join("") : '<p class="lead">Keine offenen Aufgaben. 🎾</p>'}
  </div>`;
}

function viewTasks() {
  if (!st.tasks) return '<div class="wrap"><div class="loading">Lädt …</div></div>';
  const f = st.tf || (st.tf = { scope: "mine" }), mgr = canManage();
  if (!mgr && (f.scope === "all" || f.scope === "tpl" || f.scope === "sug")) f.scope = "mine";
  const tabs = [["mine", "Meine"], ...(mgr ? [["all", "Alle"], ["team", "Team"]] : []), ["done", "Erledigt"], ...(mgr ? [["tpl", "Wiederkehrend"], ["sug", "Vorschläge" + ((st.suggestions || []).filter(x => x.status === "neu").length ? ` (${(st.suggestions || []).filter(x => x.status === "neu").length})` : "")]] : [])];
  if (!mgr && f.scope === "team") f.scope = "mine";
  let body, body0 = "";
  if (f.scope === "tpl") body = viewTemplates();
  else if (f.scope === "sug") body = viewSuggestions();
  else if (f.scope === "team") body = viewTeam();
  else {
    let L = st.tasks.list.filter(t => !t.recurring_id);
    if (f.scope === "done") L = L.filter(t => t.status === "erledigt").sort((a, b) => (b.completed_at || "").localeCompare(a.completed_at || "")).slice(0, 60);
    else L = L.filter(t => t.status !== "erledigt" && (f.scope === "all" || relevantToMe(t))
      && (f.scope !== "all" || !f.who || t.owner_id === f.who || (st.tasks.parts[t.id] || []).includes(f.who))).sort(byUrgency);
    if (f.scope === "all" && f.who) body0 = `<div class="chips" style="margin-bottom:12px"><button class="chip" aria-pressed="true" data-twhoclear="1">Nur ${esc(st.data.player[f.who]?.name || "")} ✕</button></div>`;
    body = L.length ? L.map(tCard).join("") : `<div class="empty"><b>${f.scope === "done" ? "Noch nichts erledigt." : "Alles erledigt."}</b>${f.scope === "done" ? "" : "Keine offenen Aufgaben."}</div>`;
  }
  return `<div class="wrap"><h1 class="display sm">Aufgaben.</h1>
    <div class="chips" style="margin:6px 0 14px;flex-wrap:wrap">${tabs.map(([k, l]) => `<button class="chip" aria-pressed="${f.scope === k}" data-tfscope="${k}">${l}</button>`).join("")}</div>
    ${f.scope === "tpl" ? '<button class="cta primary" data-tplnew style="margin-bottom:14px">Neue Daily-Vorlage</button>'
      : `<button class="cta ${mgr ? "primary" : "ghost"}" data-tnew style="margin-bottom:14px">${mgr ? "Neue Aufgabe" : "Eigene Aufgabe notieren"}</button>`}
    ${body0}${body}</div>`;
}

function viewTeam() {
  const since = Date.now() - 7 * 864e5;
  const rows = st.tasks.staff.map(p => {
    const open = st.tasks.list.filter(t => t.owner_id === p.id && t.status !== "erledigt");
    return { p, open: open.length, late: open.filter(t => tInfo(t).late).length, bl: open.filter(t => t.status === "blockiert").length,
      done: st.tasks.list.filter(t => t.completed_by === p.id && new Date(t.completed_at) > since).length };
  }).sort((a, b) => b.late - a.late || b.open - a.open);
  return `<div class="list">${rows.map(r => `<button class="li" data-twho="${r.p.id}" style="width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer">
    <span class="n"><b>${esc(r.p.name)}</b><small>${r.open} offen${r.late ? `, <span class="due-late">${r.late} überfällig</span>` : ""}${r.bl ? `, ${r.bl} blockiert` : ""} – ${r.done} erledigt in den letzten 7 Tagen</small></span>
    <span aria-hidden="true" style="color:var(--muted)">›</span></button>`).join("")}</div>`;
}

function viewTemplates() {
  const T = st.tasks.templates || [], today = isoToday();
  if (!T.length) return '<div class="empty"><b>Noch keine Vorlagen.</b>Lege zum Beispiel „Halle öffnen“ als tägliche Checkliste an.</div>';
  const days = [...Array(7)].map((_, k) => isoDay(new Date(Date.now() - (6 - k) * 864e5)));
  return T.map(p => {
    const inst = Object.fromEntries(st.tasks.list.filter(t => t.recurring_id === p.id).map(t => [t.occurrence_date, t]));
    const dots = days.map(d => { const t = inst[d];
      const c = !t ? "var(--line)" : t.status === "erledigt" ? "var(--ok)" : d < today ? "var(--need)" : "var(--orange)";
      return `<i title="${d}" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${c};margin-right:4px"></i>`; }).join("");

function formErr(sel, msg) { const e = $(sel); e.textContent = msg; e.classList.remove("hidden"); }
function saveTaskForm(id) {

  const link = v("#tf-link");

    priority: st.tform.prio, due_at: due, link_url: link || null };

    return run(async () => { await st.api.saveTemplate(null, tpl); closeSheet(); toast(`Wiederkehrend angelegt ✓ ${rhythmText(tpl)}`); });
  }
  run(async () => {
    const tid = await st.api.saveTask(st.me, id === "new" ? null : id, row, [...st.tform.parts], checklist);
    st.openTid = tid; toast("Gespeichert");
  });
}

// Klicks im Mitarbeiter-Bereich. Gibt true zurück, wenn behandelt.
function taskClick(D, b) {
  if (!st.tasks && !D.tfscope) return false;
  if (D.topen) { taskSheet(D.topen); return true; }
  if (D.tfscope) { (st.tf ||= {}).scope = D.tfscope; render(true); return true; }
  if ("tnew" in D) { taskForm(null); return true; }
  if (D.tedit) { taskForm(D.tedit); return true; }
  if (D.tstatus) {
    const id = D.id;
    if (D.tstatus === "blockiert") { blockSheet(id); return true; }
    run(async () => { st.openTid = id; await st.api.setTaskStatus(id, D.tstatus); toast(D.tstatus === "erledigt" ? "Erledigt ✓" : "Status geändert"); });
    return true;
  }
  if (D.tblockok) {
    const r = ($("#tblock")?.value || "").trim();
    if (!r) { formErr("#tblock-err", "Bitte kurz den Grund angeben."); return true; }
    run(async () => { st.openTid = D.tblockok; await st.api.setTaskStatus(D.tblockok, "blockiert", r); toast("Als blockiert markiert"); });
    return true;
  }
  if (D.tcheck) {
    const c = st.tasks.checklist.find(x => x.id === D.tcheck); if (!c) return true;
    run(async () => { st.openTid = c.task_id; await st.api.toggleCheck(c.id, !c.done); });
    return true;
  }
  if (D.tcomment) {
    const body = ($("#tcom")?.value || "").trim(); if (!body) return true;
    run(async () => { st.openTid = D.tcomment; await st.api.addComment(st.me, D.tcomment, body); toast("Kommentar gespeichert"); });
    return true;
  }
  if (D.thist) { showHistory(D.thist); return true; }
  if (D.tprio) { st.tform.prio = D.tprio; b.parentElement.querySelectorAll("[data-tprio]").forEach(x => x.setAttribute("aria-pressed", x === b)); return true; }
  if (D.tpart) { const s = st.tform.parts; s.has(D.tpart) ? s.delete(D.tpart) : s.add(D.tpart); b.setAttribute("aria-pressed", s.has(D.tpart)); return true; }
  if (D.tsave) { saveTaskForm(D.tsave); return true; }
  if (D.tdel) {
    const t = st.tasks.list.find(x => x.id === D.tdel);
    openSheet(`<h2>Löschen?</h2><p class="sub">„${esc(t?.title || "")}“ wird mit Verlauf und Kommentaren gelöscht.</p>
      <div class="actions"><button class="cta danger" data-tdelok="${D.tdel}">Ja, löschen</button><button class="cta ghost" data-topen="${D.tdel}">Zurück</button></div>`);
    st.openTid = null; return true;
  }
  if (D.tdelok) { run(async () => { await st.api.deleteTask(D.tdelok); closeSheet(); toast("Gelöscht"); }); return true; }
  if (D.twho) { st.tf = { scope: "all", who: D.twho }; render(true); return true; }
  if (D.twhoclear) { st.tf.who = null; render(true); return true; }
  if ("tplnew" in D) { tplSheet(null); return true; }
  if (D.tpledit) { tplSheet(D.tpledit); return true; }
  if (D.trep) { st.tform.rep = !st.tform.rep; b.setAttribute("aria-pressed", st.tform.rep); $("#tf-repbox")?.classList.toggle("hidden", !st.tform.rep); return true; }
  if (D.trh) { st.tform.mday = +($("#tf-mday")?.value || st.tform.mday); st.tform.rh = D.trh; const box = $("#tf-repbox"); if (box) box.innerHTML = repBox(); return true; }
  if (D.tmine) { st.tform.mine = !st.tform.mine; b.setAttribute("aria-pressed", st.tform.mine); return true; }
  if (D.twd) { const s = st.tform.wd, n = +D.twd; s.has(n) ? s.delete(n) : s.add(n); b.setAttribute("aria-pressed", s.has(n)); return true; }
  if (D.tplact) { st.tform.active = !st.tform.active; b.setAttribute("aria-pressed", st.tform.active); return true; }
  if (D.tplsave) { saveTplForm(D.tplsave); return true; }
  return false;
}

}

}
function noteClick(D) {
  if (D.nall) {
    const ids = (st.notes || []).filter(n => !n.read_at).map(n => n.id);
    (st.notes || []).forEach(n => n.read_at ||= new Date().toISOString());
    if (ids.length) st.api.markRead(ids).catch(e => toast(friendly(e)));
    render(true); return true;
  }
  if (!D.note) return false;
  const n = (st.notes || []).find(x => x.id === D.note); if (!n) return true;
  if (!n.read_at) { n.read_at = new Date().toISOString(); st.api.markRead([n.id]).catch(e => toast(friendly(e))); }
  render(true);
  if (n.ref_type === "task" && st.tasks?.list.some(t => t.id === n.ref_id)) taskSheet(n.ref_id);
  else if (n.ref_type === "session" && st.data.sessions.some(s => s.id === n.ref_id)) { st.openSid = n.ref_id; detailSheet(n.ref_id); }
  else if (n.ref_type === "event" && st.events?.byId[n.ref_id]) eventSheet(n.ref_id);
  else if (n.ref_type === "suggestion" && (st.suggestions || []).some(x => x.id === n.ref_id)) sugSheet(n.ref_id);
  else if (n.ref_type === "shift") openShiftFromNote(n.ref_id);
  else if (n.ref_type === "chat") chatSheet(n.ref_id);
  return true;
}

async function addStdTasks(eid) {
  const e = st.events.byId[eid] || st.eventsPending?.[eid], start = new Date(e.starts_at).getTime();

    await st.api.saveTask(st.me, null, { title, category_id: cat(c), priority: "normal", owner_id: null, event_id: eid,
      due_at: new Date(start + h * 36e5).toISOString() }, [], []);
}
function saveEventForm(id) {
  const v = q => ($(q)?.value || "").trim(), title = v("#ef-title"), d = v("#ef-date"), from = v("#ef-from"), to = v("#ef-to");
  if (!title) return formErr("#ef-err", "Bitte einen Titel eingeben.");
  if (!d || !from) return formErr("#ef-err", "Bitte Datum und Beginn angeben.");
  const link = v("#ef-link"); if (link && !/^https?:\/\//i.test(link)) return formErr("#ef-err", "Der Link muss mit https:// beginnen.");
  const [y, m, dd] = d.split("-").map(Number), [h, mi] = from.split(":").map(Number);
  const starts_at = berlin(y, m, dd, h, mi);
  let ends_at = null; if (to) { const [h2, m2] = to.split(":").map(Number); ends_at = berlin(y, m, dd, h2, m2); if (ends_at <= starts_at) ends_at = null; }
  const row = { title, event_type: v("#ef-type"), starts_at, ends_at, manager_id: v("#ef-mgr") || null, status: st.eform.status,
    description: v("#ef-desc") || null, link_url: link || null };
  run(async () => {
    const eid = await st.api.saveEvent(id === "new" ? null : id, row, [...st.eform.staff]);
    if (id === "new" && st.eform.std) { (st.eventsPending ||= {})[eid] = row; await addStdTasks(eid); }
    st.openEid = eid; toast("Event gespeichert");

}

/* =====================================================================
   Kalender-Export (.ics) – mit Adresse und Erinnerungen 24 h / 1 h vorher
   ===================================================================== */
const HALL_ADDRESS = "PadelBros, Wittestraße 46, 13509 Berlin-Reinickendorf";
const icsEsc = t => String(t).replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
const icsTime = iso => new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

function icsFold(line) {
  const enc = new TextEncoder(), out = []; let cur = "", n = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (n + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; n = 0; } cur += ch; n += b; }
  out.push(cur); return out.map((l, i) => (i ? " " : "") + l).join("\r\n");
}
function shiftsIcs(list) {
  const en = LANG === "en", stamp = icsTime(new Date().toISOString());
  const kind = { frueh: en ? "early shift" : "Frühschicht", spaet: en ? "late shift" : "Spätschicht", extra: en ? "extra shift" : "Zusatzschicht" };
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PadelBros//Dienstplan//DE", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  for (const s of list) lines.push("BEGIN:VEVENT", `UID:shift-${s.id}@padel-bros.de`, `DTSTAMP:${stamp}`, `DTSTART:${icsTime(s.starts_at)}`, `DTEND:${icsTime(s.ends_at)}`,
    `SUMMARY:${icsEsc("PadelBros " + kind[s.kind])}`, `LOCATION:${icsEsc(HALL_ADDRESS)}`,
    `DESCRIPTION:${icsEsc((s.note ? s.note + "\n" : "") + (en ? "Checklist and details in the app: " : "Checkliste und Details in der App: ") + "https://app.padel-bros.de")}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT24H", `DESCRIPTION:${icsEsc(en ? "Tomorrow: PadelBros shift" : "Morgen: PadelBros-Schicht")}`, "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-PT1H", `DESCRIPTION:${icsEsc(en ? "In 1 hour: PadelBros shift – time to leave" : "In 1 Stunde: PadelBros-Schicht – Zeit loszufahren")}`, "END:VALARM",
    "END:VEVENT");
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n") + "\r\n";
}
function downloadIcs(list, name) {
  if (!list.length) return toast("Keine kommenden Schichten.");
  const blob = new Blob([shiftsIcs(list)], { type: "text/calendar;charset=utf-8" }), url = URL.createObjectURL(blob);
  // iPhone/iPad: direkt öffnen → Kalender zeigt „Hinzufügen“. Sonst als Datei herunterladen.
  if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) { location.href = url; }
  else { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast(list.length === 1 ? "Schicht für den Kalender exportiert" : `${list.length} Schichten für den Kalender exportiert`);
}

const isPlanner = () => !!st.data?.player[st.me?.id]?.is_shift_planner;

const shiftHours = s => (new Date(s.ends_at) - new Date(s.starts_at)) / 36e5;
const fH = h => (Math.round(h * 100) / 100).toLocaleString(LANG === "en" ? "en-GB" : "de-DE", { maximumFractionDigits: 2 }) + " h";
const ymShift = (ym, k) => { const [y, m] = ym.split("-").map(Number), d = new Date(Date.UTC(y, m - 1 + k, 1)); return d.toISOString().slice(0, 7); };

// ---- Zeitraum: Woche (Planung) oder Monat (Übersicht)
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
